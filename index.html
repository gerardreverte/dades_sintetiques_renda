<style>
:root{
  --bg:#faf8f4; --surface:#fff; --ink:#1d2328; --muted:#5d6770; --line:#e4dfd6;
  --accent:#0e6b72; --accent-ink:#fff; --accent-soft:#e3f1f1; --warm:#c8782a; --warm-soft:#fbeedd;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 8px 24px rgba(20,30,40,.06);
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif; --display:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171b; --surface:#1a2127; --ink:#e8e6e1; --muted:#9aa5ad; --line:#2b343b;
  --accent:#58c1c8; --accent-ink:#0b1a1c; --accent-soft:#16312f; --warm:#e8a15a; --warm-soft:#33261a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --bg:#12171b; --surface:#1a2127; --ink:#e8e6e1; --muted:#9aa5ad; --line:#2b343b;
  --accent:#58c1c8; --accent-ink:#0b1a1c; --accent-soft:#16312f; --warm:#e8a15a; --warm-soft:#33261a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
img{max-width:100%;height:auto}
button{font:inherit;color:inherit}

/* barra superior */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;font-family:var(--sans)}
.brand{font-family:var(--display);font-weight:700;font-size:1.02rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.brand small{display:block;font:500 .7rem var(--sans);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--accent-soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font:600 .82rem var(--sans);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;font-size:1rem}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font:600 .82rem var(--sans);cursor:pointer}
.progress{height:3px;background:transparent}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--warm));transition:width .1s}

/* disseny general */
.shell{max-width:1180px;margin:0 auto;padding:28px 16px 80px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:48px;align-items:start}
nav.toc{position:sticky;top:84px;font-family:var(--sans);max-height:calc(100vh - 110px);overflow:auto;padding-right:6px}
nav.toc h2{font:600 .72rem var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
nav.toc ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
nav.toc li{margin:0}
nav.toc button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:8px 10px 8px 14px;margin-left:-2px;border-left:2px solid transparent;cursor:pointer;font-size:.9rem;line-height:1.35;color:var(--muted);border-radius:0 8px 8px 0}
nav.toc button:hover{color:var(--ink);background:var(--accent-soft)}
nav.toc button[aria-current="true"]{color:var(--ink);font-weight:600;border-left-color:var(--accent);background:var(--accent-soft)}
nav.toc .n{flex:none;min-width:1.5em;font:700 .75rem var(--sans);color:var(--accent)}
nav.toc .dl button{color:var(--warm);font-weight:600}
.view-toggle{margin-top:18px;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:500 .78rem var(--sans);cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{min-width:0}
.panel[hidden]{display:none}
.panel{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body.all .panel{margin-bottom:64px;padding-bottom:40px;border-bottom:1px solid var(--line)}
.panel>h2{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,3.4vw,2.35rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 .7em}
.kicker{display:inline-block;font:700 .72rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;margin-bottom:12px}
.panel h3{font-family:var(--display);font-size:1.35rem;margin:2em 0 .5em;color:var(--accent);letter-spacing:-.01em}
.panel p{margin:0 0 1.15em}
.panel .lead{font-size:1.18em}
.panel ul{padding-left:1.2em}.panel li{margin:.35em 0}
.panel li::marker{color:var(--accent)}
.grid-list{columns:2;column-gap:32px;padding:20px 24px 20px 40px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:.92em;line-height:1.5}
.grid-list li{break-inside:avoid}

.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:1.05;letter-spacing:-.03em;margin:.1em 0 .3em}
.hero .sub{font:500 1.1rem/1.5 var(--sans);color:var(--muted);margin:0 0 28px;max-width:46ch}

figure{margin:1.8em 0}
figure.fig img{display:block;width:100%;border-radius:14px;box-shadow:var(--shadow);background:#fff}
figure.fig-table img{padding:6px;border:1px solid var(--line);box-shadow:none}
figure.fig-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
figure.fig-row figcaption{grid-column:1/-1}
figcaption{font:400 .82rem/1.45 var(--sans);color:var(--muted);margin-top:8px;text-align:center}
.zoomable{cursor:zoom-in}

.eq{overflow-x:auto;padding:14px 18px;margin:1.2em 0;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;font-size:1.05em}
.eq .katex-display{margin:0}
blockquote.poem{margin:1.8em 0;padding:6px 0 6px 24px;border-left:3px solid var(--warm);font-style:italic;font-size:1.08em}
blockquote.poem p{margin:0 0 .8em}
blockquote.poem footer{font:400 .82rem var(--sans);color:var(--muted);font-style:normal}
aside.footnotes{margin-top:2.4em;padding-top:12px;border-top:1px solid var(--line);font:400 .85rem/1.5 var(--sans);color:var(--muted)}
aside.footnotes ol{margin:0;padding-left:1.3em}
sup.fnref a{text-decoration:none;font-weight:700}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;font-family:var(--sans)}
.pager button{flex:1;max-width:48%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.pager button:hover{border-color:var(--accent)}
.pager button.next{text-align:right;margin-left:auto}
.pager small{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pager span{font-weight:600;font-size:.95rem;line-height:1.3;display:block;margin-top:2px}
body.all .pager{display:none}

/* descàrregues */
.dl-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:24px 0 8px;font-family:var(--sans)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;color:var(--ink);font-size:1.25rem}
.card p{margin:0;font-size:.9rem;line-height:1.5;color:var(--muted)}
.card .meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{font:600 .72rem var(--sans);padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;margin-top:auto;padding:11px 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font:600 .92rem var(--sans)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.finder{margin-top:36px;font-family:var(--sans)}
.finder h3{font-family:var(--display)}
.finder input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 1rem var(--sans)}
.finder input:focus{outline:2px solid var(--accent);outline-offset:1px}
.tbl{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font:400 .82rem/1.4 var(--sans)}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);background:var(--accent-soft);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;font-weight:600}
tr:last-child td{border-bottom:0}
.flag{color:var(--warm);font-weight:700}
.note{margin-top:22px;padding:16px 18px;border-radius:12px;background:var(--warm-soft);font:400 .88rem/1.55 var(--sans)}
.note b{color:var(--warm)}
details.dict{margin-top:22px;font-family:var(--sans);font-size:.88rem}
details.dict summary{cursor:pointer;font-weight:600}
.license{margin-top:22px;font:400 .85rem/1.5 var(--sans);color:var(--muted)}

footer.site{border-top:1px solid var(--line);padding:30px 16px 50px;text-align:center;font:400 .85rem/1.6 var(--sans);color:var(--muted)}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;place-items:center;z-index:60;padding:20px;cursor:zoom-out}
.lightbox.on{display:grid}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}

@media (max-width:900px){
  body{font-size:18px}
  .shell{grid-template-columns:1fr;gap:0;padding-top:18px}
  .menu-btn{display:inline-block}
  nav.toc{position:fixed;inset:56px 0 0 0;z-index:25;background:var(--bg);padding:20px 16px;max-height:none;transform:translateX(-100%);transition:transform .25s}
  nav.toc.open{transform:none}
  .grid-list{columns:1}
  .dl-cards{grid-template-columns:1fr}
  figure.fig-row{grid-template-columns:1fr}
  .brand small{display:none}
}
@media (max-width:600px){.brand{visibility:hidden}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.top,nav.toc,.pager,.view-toggle{display:none}.shell{display:block}.panel[hidden]{display:block}}
</style>

</header>

</div>

<footer class="site" id="siteFoot"></footer>

<script>
const ARTICLE = {"ca": {"title": "Del percentil a la persona: reconstruint la distribució de la renda amb dades sintètiques", "sub": "Com generar microdades sintètiques de renda a partir d’indicadors agregats de renda", "sections": [{"title": "intro", "out": ["<figure class=\"fig\"><img src=\"img/fig1.jpeg\" loading=\"lazy\" alt=\"Imatge creada per l’autor utilitzant ChatGPT (OpenAI).\"><figcaption>Imatge creada per l’autor utilitzant ChatGPT (OpenAI).</figcaption></figure>", "<p class=\"lead\">L’any 2019 l’Instituto Nacional de Estadística (INE, és l'oficina estadística oficial d'Espanya) va publicar per primer cop una estadística experimental sobre la renda de les llars a l’Estat espanyol. L’INE va publicar un important nombre d’indicadors relacionats amb la renda a un nivell territorial molt petit, les seccions censals (les seccions censals espanyoles serien l’equivalent a les “census tract” dels Estats Units o les “lower layer super output area” d’Anglaterra o Gal·les). Aquestes dades van representar un gran avenç per als municipis, ja que fins ara només es disposava d’estimacions de renda a nivell municipal, però amb aquesta nova estadística experimental feta en col·laboració amb l’Agència Tributària Espanyola, s’aconsegueix una granularitat territorial impensable fins al moment. </p>", "<p>Tot i aquesta substancial millora, per a algunes polítiques públiques municipals, aquesta informació encara és insuficient. Sé quina és la renda mitjana o mediana d'una secció censal o d'un municipi, però no sé com es distribueix realment la renda dins d'aquell territori. I aquesta diferència és clau quan es vol identificar amb precisió situacions de pobresa.</p>", "<p>En aquest context, plantejo la generació de microdades sintètiques com una solució per \"omplir els buits\" que deixen els indicadors agregats.</p>"], "fns": [], "html": "<figure class=\"fig\"><img src=\"img/fig1.jpeg\" loading=\"lazy\" alt=\"Imatge creada per l’autor utilitzant ChatGPT (OpenAI).\"><figcaption>Imatge creada per l’autor utilitzant ChatGPT (OpenAI).</figcaption></figure><p class=\"lead\">L’any 2019 l’Instituto Nacional de Estadística (INE, és l'oficina estadística oficial d'Espanya) va publicar per primer cop una estadística experimental sobre la renda de les llars a l’Estat espanyol. L’INE va publicar un important nombre d’indicadors relacionats amb la renda a un nivell territorial molt petit, les seccions censals (les seccions censals espanyoles serien l’equivalent a les “census tract” dels Estats Units o les “lower layer super output area” d’Anglaterra o Gal·les). Aquestes dades van representar un gran avenç per als municipis, ja que fins ara només es disposava d’estimacions de renda a nivell municipal, però amb aquesta nova estadística experimental feta en col·laboració amb l’Agència Tributària Espanyola, s’aconsegueix una granularitat territorial impensable fins al moment. </p><p>Tot i aquesta substancial millora, per a algunes polítiques públiques municipals, aquesta informació encara és insuficient. Sé quina és la renda mitjana o mediana d'una secció censal o d'un municipi, però no sé com es distribueix realment la renda dins d'aquell territori. I aquesta diferència és clau quan es vol identificar amb precisió situacions de pobresa.</p><p>En aquest context, plantejo la generació de microdades sintètiques com una solució per \"omplir els buits\" que deixen els indicadors agregats.</p>"}, {"title": "La idea: una metàfora", "out": ["<figure class=\"fig\"><img src=\"img/fig2.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure>", "<p>Si una persona vol anar de Mataró a Manresa i utilitza Google Maps, obté una ruta detallada, amb cada gir i cada tram perfectament definit, i que t'apareix en un mapa molt ben dibuixat. Això seria l'equivalent a disposar de microdades reals: sé exactament com es distribueix la renda. </p>", "<figure class=\"fig\"><img src=\"img/fig3.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure>", "<p>Però sovint no tinc aquest nivell de detall de la informació. El que tinc són només alguns punts de referència: sé cap a on està ubicat Manresa, hi ha els senyals de la carretera que m'indiquen que estic anant cap a Manresa, conec la distància que hi ha Mataró i Manresa, i sé el temps aproximat que trigaré en anar de Mataró a Manresa. Això s'assembla més a seguir un sender marcat, on no tinc el recorregut complet, però sí prou pistes per reconstruir-lo. </p>", "<p>En el cas de la renda, els indicadors que proporciona l'INE —aquests 'punts de referència'— són els indicadors agregats (mediana, percentils, etc.). La clau és utilitzar aquests indicadors, juntament amb una funció de distribució definida prèviament, per reconstruir una trajectòria plausible: és a dir, una distribució completa de la renda que sigui coherent amb el que observo. </p>", "<figure class=\"fig\"><img src=\"img/fig4.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure>"], "html": "<figure class=\"fig\"><img src=\"img/fig2.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure><p>Si una persona vol anar de Mataró a Manresa i utilitza Google Maps, obté una ruta detallada, amb cada gir i cada tram perfectament definit, i que t'apareix en un mapa molt ben dibuixat. Això seria l'equivalent a disposar de microdades reals: sé exactament com es distribueix la renda. </p><figure class=\"fig\"><img src=\"img/fig3.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure><p>Però sovint no tinc aquest nivell de detall de la informació. El que tinc són només alguns punts de referència: sé cap a on està ubicat Manresa, hi ha els senyals de la carretera que m'indiquen que estic anant cap a Manresa, conec la distància que hi ha Mataró i Manresa, i sé el temps aproximat que trigaré en anar de Mataró a Manresa. Això s'assembla més a seguir un sender marcat, on no tinc el recorregut complet, però sí prou pistes per reconstruir-lo. </p><p>En el cas de la renda, els indicadors que proporciona l'INE —aquests 'punts de referència'— són els indicadors agregats (mediana, percentils, etc.). La clau és utilitzar aquests indicadors, juntament amb una funció de distribució definida prèviament, per reconstruir una trajectòria plausible: és a dir, una distribució completa de la renda que sigui coherent amb el que observo. </p><figure class=\"fig\"><img src=\"img/fig4.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure>"}, {"title": "Els passos", "out": ["<p>El procés per generar aquestes microdades sintètiques no és immediat, sinó que requereix diverses fases.</p>", "<p>En primer lloc, identifico quines funcions de distribució poden descriure adequadament la renda. Per fer-ho, duc a terme una fase de recerca bibliogràfica per entendre quins models s'han utilitzat habitualment en aquest àmbit (pas 1).</p>", "<p>A continuació, analitzo els indicadors de renda disponibles per determinar si hi ha prou indicadors i fins a quin punt aquests contenen informació suficient per recuperar els paràmetres de les funcions de distribució identificades en el pas anterior (pas 2). L'enllaç per accedir a les dades de l'Atles de distribució de la renda de les llars d'Espanya el trobareu <a href=\"https://ine.es/dyngs/INEbase/en/operacion.htm?c=Estadistica_C&amp;cid=1254736177088&amp;menu=resultados&amp;idp=1254735976608\" target=\"_blank\" rel=\"noopener\"><strong>aquí</strong></a>. Amb aquest objectiu, construeixo un \"laboratori estadístic\": un entorn controlat on genero dades simulades per comprovar si, a partir d'indicadors agregats, és possible recuperar la forma original de la distribució (pas 3).</p>", "<p>Un cop validada la metodologia en aquest entorn de prova, el següent pas és aplicar-la a dades reals. Això em permet estimar els paràmetres de les funcions de distribució de la renda per a cada municipi o secció censal (pas 4).</p>", "<p>A partir d'aquests paràmetres, genero microdades sintètiques dels municipis catalans que reprodueixen els indicadors observats, però que aporten un nivell de detall molt superior (pas 5).</p>", "<p>Finalment, agrupo les microdades sintètiques de renda en àmbits territorials superiors com són les comarques (una divisió administrativa intermèdia entre el municipi i Catalunya, aproximadament equivalent a un \"county\" en el context anglosaxó, tot i que amb molt menys pes administratiu) i també les agrego per al conjunt de Catalunya. L’objectiu és veure com varia el percentatge de població pobre de cada municipi prenent diferents àmbits territorials de referència: la comarca, Catalunya i l’Estat espanyol (pas 6).</p>"], "html": "<p>El procés per generar aquestes microdades sintètiques no és immediat, sinó que requereix diverses fases.</p><p>En primer lloc, identifico quines funcions de distribució poden descriure adequadament la renda. Per fer-ho, duc a terme una fase de recerca bibliogràfica per entendre quins models s'han utilitzat habitualment en aquest àmbit (pas 1).</p><p>A continuació, analitzo els indicadors de renda disponibles per determinar si hi ha prou indicadors i fins a quin punt aquests contenen informació suficient per recuperar els paràmetres de les funcions de distribució identificades en el pas anterior (pas 2). L'enllaç per accedir a les dades de l'Atles de distribució de la renda de les llars d'Espanya el trobareu <a href=\"https://ine.es/dyngs/INEbase/en/operacion.htm?c=Estadistica_C&amp;cid=1254736177088&amp;menu=resultados&amp;idp=1254735976608\" target=\"_blank\" rel=\"noopener\"><strong>aquí</strong></a>. Amb aquest objectiu, construeixo un \"laboratori estadístic\": un entorn controlat on genero dades simulades per comprovar si, a partir d'indicadors agregats, és possible recuperar la forma original de la distribució (pas 3).</p><p>Un cop validada la metodologia en aquest entorn de prova, el següent pas és aplicar-la a dades reals. Això em permet estimar els paràmetres de les funcions de distribució de la renda per a cada municipi o secció censal (pas 4).</p><p>A partir d'aquests paràmetres, genero microdades sintètiques dels municipis catalans que reprodueixen els indicadors observats, però que aporten un nivell de detall molt superior (pas 5).</p><p>Finalment, agrupo les microdades sintètiques de renda en àmbits territorials superiors com són les comarques (una divisió administrativa intermèdia entre el municipi i Catalunya, aproximadament equivalent a un \"county\" en el context anglosaxó, tot i que amb molt menys pes administratiu) i també les agrego per al conjunt de Catalunya. L’objectiu és veure com varia el percentatge de població pobre de cada municipi prenent diferents àmbits territorials de referència: la comarca, Catalunya i l’Estat espanyol (pas 6).</p>"}, {"title": "Pas 1: Quines funcions de distribució poden descriure la renda?", "out": ["<figure class=\"fig\"><img src=\"img/fig5.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure>", "<p>Per poder generar microdades sintètiques de renda a partir d’indicadors agregats, hi ha una pregunta clau que cal respondre abans de començar: <strong>quina forma té la distribució estadística de la renda?</strong></p>", "<p>La resposta no és trivial, però tampoc parteixo de zero. La literatura econòmica porta dècades estudiant aquesta qüestió, i avui disposo d'un ampli conjunt d'articles, llibres i documents de treball que analitzen quines funcions de distribució s'ajusten millor a les dades de renda. El consens general és clar: per modelitzar correctament la renda calen funcions prou flexibles per capturar tant la part central de la distribució com, sobretot, les seves cues, on es concentra bona part de la desigualtat.</p>", "<h3><strong>Els clàssics que encara funcionen</strong></h3>", "<p>Algunes de les distribucions més clàssiques continuen sent un bon punt de partida. La <strong>Lognormal</strong>, popularitzada per Aitchison i Brown a “<em>The</em><em> </em><em>Lognormal</em><em> Distribution </em><em>with</em><em> </em><em>Special</em><em> </em><em>Reference</em><em> to </em><em>its</em><em> Uses in </em><em>Economics</em><em>”</em> (1957), ha estat àmpliament utilitzada per modelitzar la part central de la renda, especialment sota la hipòtesi de processos multiplicatius.</p>", "<p>La <strong>Gamma</strong> també ha tingut un paper rellevant com a model flexible i relativament senzill, tant en estudis comparatius com en aplicacions específiques, com l’anàlisi de la pobresa. En aquesta línia, treballs com “<em>Measuring</em><em> </em><em>poverty</em><em> </em><em>with</em><em> </em><em>the</em><em> Foster, </em><em>Greer</em><em> </em><em>and</em><em> </em><em>Thorbecke</em><em> indexes </em><em>based</em><em> on </em><em>the</em><em> Gamma </em><em>distribution</em>” (Fernández-Morales, 2016) en mostren la utilitat en contextos aplicats.</p>", "<p>La <strong>Weibull</strong>, tot i ser menys habitual en economia de la renda, apareix en estudis empírics com el de Bandourian et al. (2002), on ofereix bons resultats dins de models parsimoniosos amb pocs paràmetres.</p>", "<h3><strong>Quan els clàssics es queden curts</strong></h3>", "<p>El problema d’aquestes distribucions és que, tot i funcionar raonablement bé en la part central de la distribució, sovint fallen en un punt crític: <strong>les cues</strong>, especialment la superior. I aquí és on entren en joc models més flexibles.</p>", "<p>La distribució de <strong>Pareto</strong> ha estat durant dècades l’eina estàndard per descriure la part alta de la renda, i continua sent fonamental en l’anàlisi de la desigualtat. Extensions com la <strong>Pareto</strong><strong> IV</strong> permeten anar un pas més enllà, introduint més flexibilitat sense perdre interpretabilitat.</p>", "<p>En paral·lel, la distribució de <strong>Dagum</strong>, introduïda per Camilo Dagum (1977, 1980), s’ha consolidat com una de les opcions més robustes en aplicacions empíriques. En comparatives internacionals, apareix de forma recurrent entre les funcions que millor ajusten la distribució completa de la renda.</p>", "<h3><em><strong>La selecció final</strong></em></h3>", "<p>Amb tot això en ment, en el laboratori estadístic he optat per treballar amb cinc funcions de distribució que cobreixen un ampli espectre de la literatura:</p>", "<ul><li><strong>Lognormal</strong><strong> i Gamma</strong>, com a models clàssics de referència. </li><li><strong>Weibull</strong>, com a alternativa parsimoniosa.</li><li><strong>Dagum</strong>, com a model flexible amb bon comportament global. </li><li><strong>Pareto</strong><strong> IV</strong>, com a extensió per capturar adequadament les cues. </li></ul>", "<p>Aquesta selecció permet comparar diferents aproximacions amb nivells de complexitat i flexibilitat diversos, mantenint alhora un enfocament viable en un context amb informació agregada.</p>"], "html": "<figure class=\"fig\"><img src=\"img/fig5.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure><p>Per poder generar microdades sintètiques de renda a partir d’indicadors agregats, hi ha una pregunta clau que cal respondre abans de començar: <strong>quina forma té la distribució estadística de la renda?</strong></p><p>La resposta no és trivial, però tampoc parteixo de zero. La literatura econòmica porta dècades estudiant aquesta qüestió, i avui disposo d'un ampli conjunt d'articles, llibres i documents de treball que analitzen quines funcions de distribució s'ajusten millor a les dades de renda. El consens general és clar: per modelitzar correctament la renda calen funcions prou flexibles per capturar tant la part central de la distribució com, sobretot, les seves cues, on es concentra bona part de la desigualtat.</p><h3><strong>Els clàssics que encara funcionen</strong></h3><p>Algunes de les distribucions més clàssiques continuen sent un bon punt de partida. La <strong>Lognormal</strong>, popularitzada per Aitchison i Brown a “<em>The</em><em> </em><em>Lognormal</em><em> Distribution </em><em>with</em><em> </em><em>Special</em><em> </em><em>Reference</em><em> to </em><em>its</em><em> Uses in </em><em>Economics</em><em>”</em> (1957), ha estat àmpliament utilitzada per modelitzar la part central de la renda, especialment sota la hipòtesi de processos multiplicatius.</p><p>La <strong>Gamma</strong> també ha tingut un paper rellevant com a model flexible i relativament senzill, tant en estudis comparatius com en aplicacions específiques, com l’anàlisi de la pobresa. En aquesta línia, treballs com “<em>Measuring</em><em> </em><em>poverty</em><em> </em><em>with</em><em> </em><em>the</em><em> Foster, </em><em>Greer</em><em> </em><em>and</em><em> </em><em>Thorbecke</em><em> indexes </em><em>based</em><em> on </em><em>the</em><em> Gamma </em><em>distribution</em>” (Fernández-Morales, 2016) en mostren la utilitat en contextos aplicats.</p><p>La <strong>Weibull</strong>, tot i ser menys habitual en economia de la renda, apareix en estudis empírics com el de Bandourian et al. (2002), on ofereix bons resultats dins de models parsimoniosos amb pocs paràmetres.</p><h3><strong>Quan els clàssics es queden curts</strong></h3><p>El problema d’aquestes distribucions és que, tot i funcionar raonablement bé en la part central de la distribució, sovint fallen en un punt crític: <strong>les cues</strong>, especialment la superior. I aquí és on entren en joc models més flexibles.</p><p>La distribució de <strong>Pareto</strong> ha estat durant dècades l’eina estàndard per descriure la part alta de la renda, i continua sent fonamental en l’anàlisi de la desigualtat. Extensions com la <strong>Pareto</strong><strong> IV</strong> permeten anar un pas més enllà, introduint més flexibilitat sense perdre interpretabilitat.</p><p>En paral·lel, la distribució de <strong>Dagum</strong>, introduïda per Camilo Dagum (1977, 1980), s’ha consolidat com una de les opcions més robustes en aplicacions empíriques. En comparatives internacionals, apareix de forma recurrent entre les funcions que millor ajusten la distribució completa de la renda.</p><h3><em><strong>La selecció final</strong></em></h3><p>Amb tot això en ment, en el laboratori estadístic he optat per treballar amb cinc funcions de distribució que cobreixen un ampli espectre de la literatura:</p><ul><li><strong>Lognormal</strong><strong> i Gamma</strong>, com a models clàssics de referència. </li><li><strong>Weibull</strong>, com a alternativa parsimoniosa.</li><li><strong>Dagum</strong>, com a model flexible amb bon comportament global. </li><li><strong>Pareto</strong><strong> IV</strong>, com a extensió per capturar adequadament les cues. </li></ul><p>Aquesta selecció permet comparar diferents aproximacions amb nivells de complexitat i flexibilitat diversos, mantenint alhora un enfocament viable en un context amb informació agregada.</p>"}, {"title": "Pas 2. Anàlisi de les dades disponibles.", "out": ["<p>Les dades de renda que proporciona l’INE són 29 indicadors. D’aquests 29 indicadors n’hi ha 7 que són indicadors demogràfics, per tant queden únicament 22 indicadors vinculats a la renda. Aquests són els 22 indicadors de renda que proporciona l’INE:</p>", "<ul class=\"grid-list\"><li>Índex de Gini</li><li>Distribució de la renda P80/P20</li><li>Renda neta mitjana per persona</li><li>Renda neta mitjana per llar</li><li>Mitjana de la renda per unitat de consum</li><li>Mediana de la renda per unitat de consum</li><li>Renda bruta mitjana per persona</li><li>Renda bruta mitjana per llar</li><li>Font d’ingrés: salari</li><li>Font d’ingrés: pensions</li><li>Font d’ingrés: prestacions per desocupació</li><li>Font d’ingrés: altres prestacions</li><li>Font d’ingrés: altres ingressos</li><li>Població amb ingressos per unitat de consum per sota de 5.000 euros</li><li>Població amb ingressos per unitat de consum per sota de 7.500 euros</li><li>Població amb ingressos per unitat de consum per sota de 10.000 euros</li><li>Població amb ingressos per unitat de consum per sota del 40% de la mediana</li><li>Població amb ingressos per unitat de consum per sota del 50% de la mediana</li><li>Població amb ingressos per unitat de consum per sota del 60% de la mediana</li><li>Població amb ingressos per unitat de consum per sobre del 140% de la mediana</li><li>Població amb ingressos per unitat de consum per sobre del 160% de la mediana</li><li>Població amb ingressos per unitat de consum per sobre del 200% de la mediana</li></ul>", "<p>Com es pot comprovar, l'indicador de població per sota o per sobre de determinats llindars de renda per unitat de consum és el que apareix més cops, i per tant aquesta dada és la que modelitzo. També hi sumo la mediana de la renda per unitat de consum, que em diu quin és el valor de la renda per unitat de consum en la qual hi ha el 50% de la població. </p>", "<p>Quan parlo de renda \"per unitat de consum\" no em refereixo simplement a la renda dividida pel nombre de persones de la llar. L'INE fa servir l'escala OCDE modificada, que assigna un pes d'1 al primer adult de la llar, 0,5 a cada membre addicional de 14 anys o més, i 0,3 a cada menor de 14 anys. La renda total de la llar es divideix per la suma d'aquests pesos, i el resultat —la renda equivalent— s'assigna per igual a totes les persones que hi conviuen. Aquest ajust reconeix que compartir llar comporta economies d'escala (no cal el doble de superfície ni el doble de subministraments per viure-hi el doble de gent), i és l'estàndard que fan servir tant l'INE com Eurostat per fer comparables llars de composicions molt diferents. </p>"], "html": "<p>Les dades de renda que proporciona l’INE són 29 indicadors. D’aquests 29 indicadors n’hi ha 7 que són indicadors demogràfics, per tant queden únicament 22 indicadors vinculats a la renda. Aquests són els 22 indicadors de renda que proporciona l’INE:</p><ul class=\"grid-list\"><li>Índex de Gini</li><li>Distribució de la renda P80/P20</li><li>Renda neta mitjana per persona</li><li>Renda neta mitjana per llar</li><li>Mitjana de la renda per unitat de consum</li><li>Mediana de la renda per unitat de consum</li><li>Renda bruta mitjana per persona</li><li>Renda bruta mitjana per llar</li><li>Font d’ingrés: salari</li><li>Font d’ingrés: pensions</li><li>Font d’ingrés: prestacions per desocupació</li><li>Font d’ingrés: altres prestacions</li><li>Font d’ingrés: altres ingressos</li><li>Població amb ingressos per unitat de consum per sota de 5.000 euros</li><li>Població amb ingressos per unitat de consum per sota de 7.500 euros</li><li>Població amb ingressos per unitat de consum per sota de 10.000 euros</li><li>Població amb ingressos per unitat de consum per sota del 40% de la mediana</li><li>Població amb ingressos per unitat de consum per sota del 50% de la mediana</li><li>Població amb ingressos per unitat de consum per sota del 60% de la mediana</li><li>Població amb ingressos per unitat de consum per sobre del 140% de la mediana</li><li>Població amb ingressos per unitat de consum per sobre del 160% de la mediana</li><li>Població amb ingressos per unitat de consum per sobre del 200% de la mediana</li></ul><p>Com es pot comprovar, l'indicador de població per sota o per sobre de determinats llindars de renda per unitat de consum és el que apareix més cops, i per tant aquesta dada és la que modelitzo. També hi sumo la mediana de la renda per unitat de consum, que em diu quin és el valor de la renda per unitat de consum en la qual hi ha el 50% de la població. </p><p>Quan parlo de renda \"per unitat de consum\" no em refereixo simplement a la renda dividida pel nombre de persones de la llar. L'INE fa servir l'escala OCDE modificada, que assigna un pes d'1 al primer adult de la llar, 0,5 a cada membre addicional de 14 anys o més, i 0,3 a cada menor de 14 anys. La renda total de la llar es divideix per la suma d'aquests pesos, i el resultat —la renda equivalent— s'assigna per igual a totes les persones que hi conviuen. Aquest ajust reconeix que compartir llar comporta economies d'escala (no cal el doble de superfície ni el doble de subministraments per viure-hi el doble de gent), i és l'estàndard que fan servir tant l'INE com Eurostat per fer comparables llars de composicions molt diferents. </p>"}, {"title": "Pas 3. El laboratori estadístic", "out": ["<figure class=\"fig\"><img src=\"img/fig6.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure>", "<p>Com que no conec quina és la distribució real de la renda a les dades de l'Atles de distribució de la renda de les llars de l’INE, he decidit crear un <strong>laboratori estadístic</strong> per fer un test de robustesa. La idea és senzilla: posar a prova diferents models per veure quins són els més flexibles i fiables.</p>", "<p>Per fer-ho, he generat escenaris sintètics amb les cinc distribucions que he esmentat anteriorment: Dagum, Pareto IV, Lognormal, Gamma i Weibull. En cadascuna d’aquestes funcions de distribució he calculat deu indicadors de referència. Mitjançant una <strong>funció de pèrdua</strong>, he analitzat com de bé s'ajusta cada model a aquests indicadors, tant si la funció coincidia amb l'original com si no. Després de 50 proves (10 per cada distribució), l'objectiu és clar: <strong>triar les dues funcions més versàtils</strong> per aplicar-les, ara sí, a les dades reals de l'Atles de distribució de la renda de les llars.</p>", "<p>El resultat del laboratori de les cinc funcions de distribució l’he sintetitzat en la següent taula de pèrdua, en la qual en les files hi ha la funció de distribució inventada, i en les columnes hi ha la funció de distribució que he intentat ajustar. El valor de les cel·les és l’error mitjà obtingut en les 10 proves fetes.</p>", "<figure class=\"fig fig-table\"><img src=\"img/fig7_ca.png\" loading=\"lazy\" alt=\"Matriu d&#x27;errors d&#x27;estimació de la renda: files amb la distribució real, columnes amb la distribució estimada\"></figure>", "<p>Tal com era esperable, els valors de la diagonal són els més baixos: quan s’estima una distribució amb dades generades per aquella mateixa distribució, l’error és mínim. L’única excepció rellevant és la Pareto IV, en què la Dagum obté un error lleugerament inferior. Aquest resultat no indica que la Dagum descrigui millor les cues altes que la pròpia Pareto IV, sinó que l’ajust de la Pareto IV és menys estable amb un nombre limitat d’indicadors agregats. Si es mira la mitjana de cada columna, les dues distribucions amb menor error mitjà són la Dagum i la Pareto IV, amb errors de 0,0945 i 0,3084 respectivament. </p>", "<p>Donat que en la realitat no sé quina funció de distribució segueix la renda a cada municipi o secció censal, i ajustar cinc models diferents per a cada territori seria ineficient, el meu objectiu del laboratori era doble: per una part verificar que és factible trobar la funció de distribució estadística a partir dels indicadors que proporciona l’INE, i per altra part identificar quines dues funcions de distribució ofereixen el millor ajust general, independentment de la naturalesa real de les dades de partida. Es tracta, en essència, de seleccionar les eines més robustes que em garanteixin l'error més baix en el ventall més ampli d'escenaris possibles. El resultat que dóna la taula, mostra com els millors ajustos tenen lloc en la funció de distribució Dagum i en la Pareto IV. </p>", "<p>Per tant aquestes dues funcions de distribució (Dagum i Pareto IV) seran les que s’utilitzaran per obtenir els paràmetres en cadascun dels municipis catalans.</p>"], "html": "<figure class=\"fig\"><img src=\"img/fig6.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure><p>Com que no conec quina és la distribució real de la renda a les dades de l'Atles de distribució de la renda de les llars de l’INE, he decidit crear un <strong>laboratori estadístic</strong> per fer un test de robustesa. La idea és senzilla: posar a prova diferents models per veure quins són els més flexibles i fiables.</p><p>Per fer-ho, he generat escenaris sintètics amb les cinc distribucions que he esmentat anteriorment: Dagum, Pareto IV, Lognormal, Gamma i Weibull. En cadascuna d’aquestes funcions de distribució he calculat deu indicadors de referència. Mitjançant una <strong>funció de pèrdua</strong>, he analitzat com de bé s'ajusta cada model a aquests indicadors, tant si la funció coincidia amb l'original com si no. Després de 50 proves (10 per cada distribució), l'objectiu és clar: <strong>triar les dues funcions més versàtils</strong> per aplicar-les, ara sí, a les dades reals de l'Atles de distribució de la renda de les llars.</p><p>El resultat del laboratori de les cinc funcions de distribució l’he sintetitzat en la següent taula de pèrdua, en la qual en les files hi ha la funció de distribució inventada, i en les columnes hi ha la funció de distribució que he intentat ajustar. El valor de les cel·les és l’error mitjà obtingut en les 10 proves fetes.</p><figure class=\"fig fig-table\"><img src=\"img/fig7_ca.png\" loading=\"lazy\" alt=\"Matriu d&#x27;errors d&#x27;estimació de la renda: files amb la distribució real, columnes amb la distribució estimada\"></figure><p>Tal com era esperable, els valors de la diagonal són els més baixos: quan s’estima una distribució amb dades generades per aquella mateixa distribució, l’error és mínim. L’única excepció rellevant és la Pareto IV, en què la Dagum obté un error lleugerament inferior. Aquest resultat no indica que la Dagum descrigui millor les cues altes que la pròpia Pareto IV, sinó que l’ajust de la Pareto IV és menys estable amb un nombre limitat d’indicadors agregats. Si es mira la mitjana de cada columna, les dues distribucions amb menor error mitjà són la Dagum i la Pareto IV, amb errors de 0,0945 i 0,3084 respectivament. </p><p>Donat que en la realitat no sé quina funció de distribució segueix la renda a cada municipi o secció censal, i ajustar cinc models diferents per a cada territori seria ineficient, el meu objectiu del laboratori era doble: per una part verificar que és factible trobar la funció de distribució estadística a partir dels indicadors que proporciona l’INE, i per altra part identificar quines dues funcions de distribució ofereixen el millor ajust general, independentment de la naturalesa real de les dades de partida. Es tracta, en essència, de seleccionar les eines més robustes que em garanteixin l'error més baix en el ventall més ampli d'escenaris possibles. El resultat que dóna la taula, mostra com els millors ajustos tenen lloc en la funció de distribució Dagum i en la Pareto IV. </p><p>Per tant aquestes dues funcions de distribució (Dagum i Pareto IV) seran les que s’utilitzaran per obtenir els paràmetres en cadascun dels municipis catalans.</p>"}, {"title": "Pas 4. Producció: obtenció dels paràmetres a partir dels indicadors de renda", "out": ["<figure class=\"fig\"><img src=\"img/fig8.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure>", "<p>Un cop el laboratori estadístic ha demostrat la viabilitat per obtenir els paràmetres, i ha permès identificar com les distribucions de Dagum i la Pareto IV són les que s’ajusten millor, el següent pas consisteix en passar-ho al “món real”, és a dir, a utilitzar els indicadors de renda que l’INE proporciona per tal d’obtenir els paràmetres de la funció de distribució Dagum i la Pareto IV per cadascun dels municipis catalans dels que es disposa de tots els indicadors vinculats a la renda per unitat de consum. </p>", "<p>Catalunya té 947 municipis i 8,2 milions d’habitants, però municipis catalans que tinguin tots els indicadors de renda per unitat de consum n’hi ha 614, i aquests 614 municipis acumulen gairebé 7,8 milions d’habitants. </p>", "<p>A diferència del laboratori estadístic, aquí la funció de pèrdua que he utilitzat per ajustar les dades de l’INE incorpora una penalització quadràtica per mantenir els paràmetres dins d’uns marges econòmicament raonables:</p>", "<div class=\"eq\">\\[L_{\\text{total}}(\\theta)=L_{\\text{indicadors}}(x(\\theta))+P_{\\text{frontera}}(x(\\theta))\\]</div>", "<p>On:</p>", "<ul><li>\\(\\theta\\in\\mathbb{R}^{K}\\)representa el vector de paràmetres en l’espai no acotat utilitzat per l’optimitzador numèric.</li><li>\\(x(\\theta)\\) és el vector de paràmetres econòmics reals. La transformació no és uniforme: per a les formes i escales (shape1, shape2 i scale a la Dagum; scale i shape a la Pareto IV) s'aplica una exponencial, que garanteix que siguin positius però no fixa cap límit superior. El paràmetre d'inequality de la Pareto IV, en canvi, es transforma amb una funció logística que sí l'acota estrictament dins del rang [lb, ub]. Per això cal la penalització \\(P_{\\text{frontera}}\\): excepte en el cas de la inequality (ja acotada per construcció), la transformació exponencial per si sola no impedeix que l'optimitzador explori formes o escales fora dels marges econòmicament raonables. </li><li>\\(L_{\\text{indicadors}}\\) és la suma dels errors quadràtics.</li><li>\\(P_{\\text{frontera}}\\) és la penalització per superar els llindars fixats als paràmetres.</li></ul>", "<p>El primer component de la funció de pèrdua mesura la suma dels errors quadràtics relatius respecte dels indicadors de l’Atles de distribució de renda de les llars de l’INE. L’error de cada indicador està ponderat amb un pes específic (\\(w_j\\)). Al denominador s’hi afegeix una constant epsilon, amb valor 10⁻⁶, per evitar divisions per zero i garantir que el càlcul sigui estable.</p>", "<div class=\"eq\">\\[L_{\\text{indicadors}}(x)=\\sum_{j=1}^{J} w_j\\cdot\\left(\\frac{\\hat I_j(x)-I_j}{I_j+\\epsilon}\\right)^{2}\\]</div>", "<p>On:</p>", "<ul><li><em>j</em> fa referència a la llista d’indicadors que s’avaluen (població amb ingressos per unitat de consum per sota de 5.000 euros, població amb ingressos per unitat de consum per sota de 7.500 euros, població amb ingressos per unitat de consum per sota de 10.000 euros, població amb ingressos per unitat de consum per sota del 40% de la mediana, població amb ingressos per unitat de consum per sota del 50% de la mediana, població amb ingressos per unitat de consum per sota del 60% de la mediana, població amb ingressos per unitat de consum per sobre del 140% de la mediana, població amb ingressos per unitat de consum per sobre del 160% de la mediana, població amb ingressos per unitat de consum per sobre del 200% de la mediana, mediana de la renda per unitat de consum, índex de Gini, i P80/P20).</li><li>\\(I_j\\) és el valor de cadascun dels indicadors que proporciona l’Atles de distribució de la renda de l’INE.</li><li>\\(\\hat I_j\\) és el valor de l’estimació de cadascun dels indicadors. </li><li>\\(\\epsilon\\) és una constant amb valor 10<sup>-6</sup>.</li></ul>", "<p>El segon component és una penalització suau que actua quan els paràmetres surten dels marges definits. En l’algoritme de càlcul, els paràmetres de la Dagum i de la Pareto IV s’han acotat tant per baix com per dalt. L’objectiu és evitar valors extrems que poden reduir l’error matemàtic però que no tenen sentit des del punt de vista econòmic.</p>", "<p>Això és especialment important perquè l’algoritme BFGS<sup><sup class=\"fnref\"><a href=\"#fn1\" id=\"fnr1\">1</a></sup></sup> és un optimitzador quasi-Newton no acotat. En termes pràctics, vol dir que es mou lliurement per l’espai de paràmetres: proposa uns valors, calcula la funció de pèrdua, estima cap a on baixa l’error i torna a proposar valors nous. Si no se li posa cap mena de fre, pot acabar explorant combinacions absurdes simplement perquè redueixen l’error en termes numèrics. La penalització fa de tanca: no impedeix del tot el moviment, però encareix les sortides fora del rang raonable.</p>", "<div class=\"eq\">\\[P_{\\text{frontera}}(x)=\\lambda\\cdot\\sum_{k=1}^{K}\\left[\\left(\\frac{\\max(0,\\,lb_k-x_k)}{ub_k-lb_k}\\right)^{2}+\\left(\\frac{\\max(0,\\,x_k-ub_k)}{ub_k-lb_k}\\right)^{2}\\right]\\]</div>", "<p>On:</p>", "<ul><li><em>k</em> fa referència a cadascun dels paràmetres de la funció de distribució.</li><li>\\(\\lambda\\) és la penalització que se li atorga per superar el llindars marcats als paràmetres. </li><li>\\(lb_k\\) i \\(ub_k\\) són els llindars inferiors i superiors assignats als paràmetres.</li><li>\\(x_k\\) és el valor del paràmetre <em>k</em> que l'ordinador està provant en aquell instant de la iteració.</li></ul>", "<p>A més d'aquest control, per a cada municipi no faig un únic intent d'ajust, sinó que repeteixo el càlcul complet 40 cops per a la Dagum i 60 per a la Pareto IV, començant cada cop des d'un punt de partida diferent i deixant que l'algoritme baixi per a cada valor inicial fins al seu mínim, per finalment quedar-me amb el resultat que presenti el millor ajust de tots. Amb aquest inici múltiple es redueix molt el risc de quedar-me amb una solució que pot semblar bona però que no és la millor possible. Cadascun dels inicis s'atura si s’arriba a les 400 iteracions, o abans si en dues iteracions consecutives la millora en el resultat és mínima (de 0,00000001).</p>", "<p>El fet d’utilitzar un nombre major de valors inicials en la Pareto IV que en la Dagum respon al fet que en el laboratori estadístic vaig poder comprovar que és més costós per a una Pareto IV trobar un mínim bo, tal i com ho demostra el fet que l’error mitjà de la Pareto IV era considerablement més elevat que el de la Dagum.</p>", "<p>Tot i que la funció de pèrdua permet ponderar de manera diferent cada indicador, en aquesta aplicació he optat per assignar el mateix pes a tots els indicadors utilitzats. L'única excepció és el coeficient de Gini, que he exclòs de la funció de pèrdua assignant-li un pes a \\(w_{\\text{Gini}}=0\\). El motiu és que no existeix una fórmula que permeti calcular l’índex de Gini winsoritzat, que és l’indicador que proporciona l’INE. La manera de calcular-lo és fent simulacions de Montecarlo a partir de dades aleatòries, i això té una doble implicació: per una banda té un elevat cost computacional realitzar les simulacions de Montecarlo per calcular l'índex de Gini winsoritzat; i per una altra, com que aquestes dades es generen a l'atzar, la funció de pèrdua deixa de ser determinista en aquest punt, cosa que xoca amb l’algoritme BFGS, el qual assumeix que la funció que està optimitzant és determinista, fent que aquest soroll que generen les dades aleatòries desestabilitzi la convergència que busca BFGS.</p>", "<p>La taula següent presenta els valors dels paràmetres estimats per als 10 primers municipis catalans ordenats alfabèticament, així com diversos indicadors de qualitat de l’ajust. L’<em><strong>error mitjà</strong></em> és la mitjana de les diferències, en punts percentuals, entre la simulació i les dades de l’INE per als indicadors de renda per unitat de consum. L’<em><strong>error màxim </strong></em>recull la diferència més gran observada en cada municipi entre els 9 indicadors de renda per unitat de consum. L’<em><strong>error renda mediana</strong></em> mesura la desviació percentual entre la renda mediana estimada pel model i la mediana publicada per l’INE. L’<em><strong>error P80/P20</strong></em> indica l’error percentual en la ràtio de desigualtat P80/P20. Finalment, la <em><strong>Pèrdua final</strong></em> és el valor de la funció objectiu un cop finalitzat l’algorisme d’optimització.</p>", "<figure class=\"fig fig-table\"><img src=\"img/fig9_ca.png\" loading=\"lazy\" alt=\"Taula comparativa de l&#x27;ajust Dagum vs. Pareto IV per als 10 primers municipis de Catalunya\"></figure>"], "html": "<figure class=\"fig\"><img src=\"img/fig8.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure><p>Un cop el laboratori estadístic ha demostrat la viabilitat per obtenir els paràmetres, i ha permès identificar com les distribucions de Dagum i la Pareto IV són les que s’ajusten millor, el següent pas consisteix en passar-ho al “món real”, és a dir, a utilitzar els indicadors de renda que l’INE proporciona per tal d’obtenir els paràmetres de la funció de distribució Dagum i la Pareto IV per cadascun dels municipis catalans dels que es disposa de tots els indicadors vinculats a la renda per unitat de consum. </p><p>Catalunya té 947 municipis i 8,2 milions d’habitants, però municipis catalans que tinguin tots els indicadors de renda per unitat de consum n’hi ha 614, i aquests 614 municipis acumulen gairebé 7,8 milions d’habitants. </p><p>A diferència del laboratori estadístic, aquí la funció de pèrdua que he utilitzat per ajustar les dades de l’INE incorpora una penalització quadràtica per mantenir els paràmetres dins d’uns marges econòmicament raonables:</p><div class=\"eq\">\\[L_{\\text{total}}(\\theta)=L_{\\text{indicadors}}(x(\\theta))+P_{\\text{frontera}}(x(\\theta))\\]</div><p>On:</p><ul><li>\\(\\theta\\in\\mathbb{R}^{K}\\) representa el vector de paràmetres en l’espai no acotat utilitzat per l’optimitzador numèric.</li><li>\\(x(\\theta)\\) és el vector de paràmetres econòmics reals. La transformació no és uniforme: per a les formes i escales (shape1, shape2 i scale a la Dagum; scale i shape a la Pareto IV) s'aplica una exponencial, que garanteix que siguin positius però no fixa cap límit superior. El paràmetre d'inequality de la Pareto IV, en canvi, es transforma amb una funció logística que sí l'acota estrictament dins del rang [lb, ub]. Per això cal la penalització \\(P_{\\text{frontera}}\\): excepte en el cas de la inequality (ja acotada per construcció), la transformació exponencial per si sola no impedeix que l'optimitzador explori formes o escales fora dels marges econòmicament raonables. </li><li>\\(L_{\\text{indicadors}}\\) és la suma dels errors quadràtics.</li><li>\\(P_{\\text{frontera}}\\) és la penalització per superar els llindars fixats als paràmetres.</li></ul><p>El primer component de la funció de pèrdua mesura la suma dels errors quadràtics relatius respecte dels indicadors de l’Atles de distribució de renda de les llars de l’INE. L’error de cada indicador està ponderat amb un pes específic (\\(w_j\\)). Al denominador s’hi afegeix una constant epsilon, amb valor 10⁻⁶, per evitar divisions per zero i garantir que el càlcul sigui estable.</p><div class=\"eq\">\\[L_{\\text{indicadors}}(x)=\\sum_{j=1}^{J} w_j\\cdot\\left(\\frac{\\hat I_j(x)-I_j}{I_j+\\epsilon}\\right)^{2}\\]</div><p>On:</p><ul><li><em>j</em> fa referència a la llista d’indicadors que s’avaluen (població amb ingressos per unitat de consum per sota de 5.000 euros, població amb ingressos per unitat de consum per sota de 7.500 euros, població amb ingressos per unitat de consum per sota de 10.000 euros, població amb ingressos per unitat de consum per sota del 40% de la mediana, població amb ingressos per unitat de consum per sota del 50% de la mediana, població amb ingressos per unitat de consum per sota del 60% de la mediana, població amb ingressos per unitat de consum per sobre del 140% de la mediana, població amb ingressos per unitat de consum per sobre del 160% de la mediana, població amb ingressos per unitat de consum per sobre del 200% de la mediana, mediana de la renda per unitat de consum, índex de Gini, i P80/P20).</li><li>\\(I_j\\) és el valor de cadascun dels indicadors que proporciona l’Atles de distribució de la renda de l’INE.</li><li>\\(\\hat I_j\\) és el valor de l’estimació de cadascun dels indicadors. </li><li>\\(\\epsilon\\) és una constant amb valor 10<sup>-6</sup>.</li></ul><p>El segon component és una penalització suau que actua quan els paràmetres surten dels marges definits. En l’algoritme de càlcul, els paràmetres de la Dagum i de la Pareto IV s’han acotat tant per baix com per dalt. L’objectiu és evitar valors extrems que poden reduir l’error matemàtic però que no tenen sentit des del punt de vista econòmic.</p><p>Això és especialment important perquè l’algoritme BFGS<sup><sup class=\"fnref\"><a href=\"#fn1\" id=\"fnr1\">1</a></sup></sup> és un optimitzador quasi-Newton no acotat. En termes pràctics, vol dir que es mou lliurement per l’espai de paràmetres: proposa uns valors, calcula la funció de pèrdua, estima cap a on baixa l’error i torna a proposar valors nous. Si no se li posa cap mena de fre, pot acabar explorant combinacions absurdes simplement perquè redueixen l’error en termes numèrics. La penalització fa de tanca: no impedeix del tot el moviment, però encareix les sortides fora del rang raonable.</p><div class=\"eq\">\\[P_{\\text{frontera}}(x)=\\lambda\\cdot\\sum_{k=1}^{K}\\left[\\left(\\frac{\\max(0,\\,lb_k-x_k)}{ub_k-lb_k}\\right)^{2}+\\left(\\frac{\\max(0,\\,x_k-ub_k)}{ub_k-lb_k}\\right)^{2}\\right]\\]</div><p>On:</p><ul><li><em>k</em> fa referència a cadascun dels paràmetres de la funció de distribució.</li><li>\\(\\lambda\\) és la penalització que se li atorga per superar el llindars marcats als paràmetres. </li><li>\\(lb_k\\) i \\(ub_k\\) són els llindars inferiors i superiors assignats als paràmetres.</li><li>\\(x_k\\) és el valor del paràmetre <em>k</em> que l'ordinador està provant en aquell instant de la iteració.</li></ul><p>A més d'aquest control, per a cada municipi no faig un únic intent d'ajust, sinó que repeteixo el càlcul complet 40 cops per a la Dagum i 60 per a la Pareto IV, començant cada cop des d'un punt de partida diferent i deixant que l'algoritme baixi per a cada valor inicial fins al seu mínim, per finalment quedar-me amb el resultat que presenti el millor ajust de tots. Amb aquest inici múltiple es redueix molt el risc de quedar-me amb una solució que pot semblar bona però que no és la millor possible. Cadascun dels inicis s'atura si s’arriba a les 400 iteracions, o abans si en dues iteracions consecutives la millora en el resultat és mínima (de 0,00000001).</p><p>El fet d’utilitzar un nombre major de valors inicials en la Pareto IV que en la Dagum respon al fet que en el laboratori estadístic vaig poder comprovar que és més costós per a una Pareto IV trobar un mínim bo, tal i com ho demostra el fet que l’error mitjà de la Pareto IV era considerablement més elevat que el de la Dagum.</p><p>Tot i que la funció de pèrdua permet ponderar de manera diferent cada indicador, en aquesta aplicació he optat per assignar el mateix pes a tots els indicadors utilitzats. L'única excepció és el coeficient de Gini, que he exclòs de la funció de pèrdua assignant-li un pes a \\(w_{\\text{Gini}}=0\\). El motiu és que no existeix una fórmula que permeti calcular l’índex de Gini winsoritzat, que és l’indicador que proporciona l’INE. La manera de calcular-lo és fent simulacions de Montecarlo a partir de dades aleatòries, i això té una doble implicació: per una banda té un elevat cost computacional realitzar les simulacions de Montecarlo per calcular l'índex de Gini winsoritzat; i per una altra, com que aquestes dades es generen a l'atzar, la funció de pèrdua deixa de ser determinista en aquest punt, cosa que xoca amb l’algoritme BFGS, el qual assumeix que la funció que està optimitzant és determinista, fent que aquest soroll que generen les dades aleatòries desestabilitzi la convergència que busca BFGS.</p><p>La taula següent presenta els valors dels paràmetres estimats per als 10 primers municipis catalans ordenats alfabèticament, així com diversos indicadors de qualitat de l’ajust. L’<em><strong>error mitjà</strong></em> és la mitjana de les diferències, en punts percentuals, entre la simulació i les dades de l’INE per als indicadors de renda per unitat de consum. L’<em><strong>error màxim </strong></em>recull la diferència més gran observada en cada municipi entre els 9 indicadors de renda per unitat de consum. L’<em><strong>error renda mediana</strong></em> mesura la desviació percentual entre la renda mediana estimada pel model i la mediana publicada per l’INE. L’<em><strong>error P80/P20</strong></em> indica l’error percentual en la ràtio de desigualtat P80/P20. Finalment, la <em><strong>Pèrdua final</strong></em> és el valor de la funció objectiu un cop finalitzat l’algorisme d’optimització.</p><figure class=\"fig fig-table\"><img src=\"img/fig9_ca.png\" loading=\"lazy\" alt=\"Taula comparativa de l&#x27;ajust Dagum vs. Pareto IV per als 10 primers municipis de Catalunya\"></figure><aside class=\"footnotes\"><ol start=\"1\"><li id=\"fn1\">Algoritme Broyden-Fletcher-Goldfarb-Shanno (BFGS). <a href=\"#fnr1\" class=\"back\" aria-label=\"↩\">↩</a></li></ol></aside>"}, {"title": "Pas 5. Generar microdades sintètiques de la renda a nivell municipal.", "out": ["<figure class=\"fig\"><img src=\"img/fig10.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure>", "<p>Un cop he calculat els paràmetres de cada funció de distribució de la renda (Dagum i Pareto IV) per cada municipi català, el següent pas és trivial ja que només consisteix en generar tantes dades de renda per unitat de consum com habitants hi ha al municipi, utilitzant els paràmetres obtinguts en el pas anterior. I puc generar per cada municipi, amb els mateixos paràmetres, tantes dades sintètiques com vulgui, i això és força interessant ja que em permet construir intervals de confiança utilitzant el mètode de Montecarlo. Programes com Python o, com és en aquest cas R, disposen de paquets amb funcions que permeten generar dades que segueixen la distribució estadística Pareto IV i Dagum; en aquest treball concret he fet servir el paquet VGAM.</p>"], "html": "<figure class=\"fig\"><img src=\"img/fig10.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure><p>Un cop he calculat els paràmetres de cada funció de distribució de la renda (Dagum i Pareto IV) per cada municipi català, el següent pas és trivial ja que només consisteix en generar tantes dades de renda per unitat de consum com habitants hi ha al municipi, utilitzant els paràmetres obtinguts en el pas anterior. I puc generar per cada municipi, amb els mateixos paràmetres, tantes dades sintètiques com vulgui, i això és força interessant ja que em permet construir intervals de confiança utilitzant el mètode de Montecarlo. Programes com Python o, com és en aquest cas R, disposen de paquets amb funcions que permeten generar dades que segueixen la distribució estadística Pareto IV i Dagum; en aquest treball concret he fet servir el paquet VGAM.</p>"}, {"title": "Pas 6. Càlcul del percentatge de població que està per sota del llindar de pobresa.", "out": ["<figure class=\"fig\"><img src=\"img/fig11.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure>", "<p>I tot això per a què? Existeix una convenció adoptada per Eurostat (organisme europeu d’estadística) i la Unió Europea (i seguida per l’INE), que fixa el llindar del risc de pobresa en el 60% de la renda mediana per unitat de consum. Certament aquest és un dels indicadors que proporciona l’INE, el problema, però, rau en el fet que la mediana que utilitza l’INE és la del conjunt de l’Estat espanyol, i els qui coneguin una mica Espanya sabran que hi ha regions amb la renda més alta que unes altres (com passa en tants altres països). En el cas de Catalunya, la seva renda està entre les més altes d’Espanya, i per tant en utilitzar com a referència la renda mediana espanyola, el percentatge de població catalana que es troba per sota del 60% de la renda mediana espanyola és inferior al percentatge de població catalana que es trobaria si s’utilitzés el 60% de la renda mediana catalana com a llindar.</p>", "<p>El fet de tenir les microdades sintètiques de renda de cada municipi català em permet generar diferents llindars de pobresa utilitzant diferents àmbits territorials de referència. Així, a continuació presento 3 mapes dels municipis de Catalunya, amb el percentatge de població que està per sota del llindar de pobresa, essent aquest llindar diferent en funció de si l’àmbit territorial de referència és la comarca, Catalunya o Espanya.</p>", "<figure class=\"fig fig-row\"><img src=\"img/fig12.png\" loading=\"lazy\" alt=\"\"><img src=\"img/fig13.png\" loading=\"lazy\" alt=\"\"><img src=\"img/fig14.png\" loading=\"lazy\" alt=\"\"></figure>", "<p>Els resultats del conjunt de tota Catalunya queden resumits en la següent taula.</p>", "<figure class=\"fig fig-table\"><img src=\"img/fig15.png\" loading=\"lazy\" alt=\"\"></figure>", "<p>La taula mostra com utilitzant la mediana del conjunt d’Espanya el percentatge de població per sota del llindar de pobresa a Catalunya se situa en el 17,4%, mentre que utilitzant la mediana de Catalunya la taxa de pobresa se situa a tocar del 21%, i utilitzant la mediana de la comarca se situa en el 20,7%. Tot i que els percentatges per al conjunt de Catalunya són molt similars utilitzant la mediana de la comarca que utilitzant la mediana de Catalunya, territorialment és on es presenten les principals diferències, tal i com mostren els mapes, ja que les comarques properes a la capital, Barcelona, presenten percentatges de població per sota del 60% de la renda mediana utilitzant el llindar comarcal més elevats que si s’utilitza el llindar del conjunt de Catalunya.</p>"], "html": "<figure class=\"fig\"><img src=\"img/fig11.png\" loading=\"lazy\" alt=\"Imatge creada per Mon Culleré Córdoba.\"><figcaption>Imatge creada per Mon Culleré Córdoba.</figcaption></figure><p>I tot això per a què? Existeix una convenció adoptada per Eurostat (organisme europeu d’estadística) i la Unió Europea (i seguida per l’INE), que fixa el llindar del risc de pobresa en el 60% de la renda mediana per unitat de consum. Certament aquest és un dels indicadors que proporciona l’INE, el problema, però, rau en el fet que la mediana que utilitza l’INE és la del conjunt de l’Estat espanyol, i els qui coneguin una mica Espanya sabran que hi ha regions amb la renda més alta que unes altres (com passa en tants altres països). En el cas de Catalunya, la seva renda està entre les més altes d’Espanya, i per tant en utilitzar com a referència la renda mediana espanyola, el percentatge de població catalana que es troba per sota del 60% de la renda mediana espanyola és inferior al percentatge de població catalana que es trobaria si s’utilitzés el 60% de la renda mediana catalana com a llindar.</p><p>El fet de tenir les microdades sintètiques de renda de cada municipi català em permet generar diferents llindars de pobresa utilitzant diferents àmbits territorials de referència. Així, a continuació presento 3 mapes dels municipis de Catalunya, amb el percentatge de població que està per sota del llindar de pobresa, essent aquest llindar diferent en funció de si l’àmbit territorial de referència és la comarca, Catalunya o Espanya.</p><figure class=\"fig fig-row\"><img src=\"img/fig12.png\" loading=\"lazy\" alt=\"\"><img src=\"img/fig13.png\" loading=\"lazy\" alt=\"\"><img src=\"img/fig14.png\" loading=\"lazy\" alt=\"\"></figure><p>Els resultats del conjunt de tota Catalunya queden resumits en la següent taula.</p><figure class=\"fig fig-table\"><img src=\"img/fig15.png\" loading=\"lazy\" alt=\"\"></figure><p>La taula mostra com utilitzant la mediana del conjunt d’Espanya el percentatge de població per sota del llindar de pobresa a Catalunya se situa en el 17,4%, mentre que utilitzant la mediana de Catalunya la taxa de pobresa se situa a tocar del 21%, i utilitzant la mediana de la comarca se situa en el 20,7%. Tot i que els percentatges per al conjunt de Catalunya són molt similars utilitzant la mediana de la comarca que utilitzant la mediana de Catalunya, territorialment és on es presenten les principals diferències, tal i com mostren els mapes, ja que les comarques properes a la capital, Barcelona, presenten percentatges de població per sota del 60% de la renda mediana utilitzant el llindar comarcal més elevats que si s’utilitza el llindar del conjunt de Catalunya.</p>"}, {"title": "Pensaments finals", "out": ["<blockquote class=\"poem\"><p>As you set out for Ithaka<br>hope the voyage is a long one,<br>full of adventure, full of discovery.</p><footer>— C. P. Cavafy, \"Ithaka,\" translated by Edmund Keeley and Philip Sherrard</footer></blockquote>", "<p>Amb aquest article he mostrat que, si tens prou indicadors agregats sobre un mateix fenomen i pots identificar quina funció de distribució estadística s'hi ajusta bé, tens la capacitat de generar microdades sintètiques a partir d'aquesta informació agregada.</p>", "<p>Personalment, més que les microdades sintètiques en si, el més important ha estat tot el camí recorregut i els aprenentatges que me n’emporto. </p>", "<p>Estem en l’any on la pel·lícula de Christopher Nolan “The Odyssey” ha estat segurament la pel·lícula de l’estiu. “The Odyssey” explica el viatge de retorn cap a casa, cap a Ítaca, d’Odisseu (o Ulisses per als romans) després de la victòria en la guerra de Troia, i crec que el poema “Ítaca” de Kavafis sobre aquest viatge reflecteix perfectament el que jo m’emporto de tot el “meu viatge” amb les dades sintètiques:</p>", "<blockquote class=\"poem\"><p>Ithaka gave you the marvelous journey.<br>Without her you wouldn't have set out.</p><p>Wise as you will have become, so full of experience,<br>you'll have understood by then what these Ithakas mean.</p><footer>— C. P. Cavafy, \"Ithaka,\" translated by Edmund Keeley and Philip Sherrard</footer></blockquote>"], "html": "<blockquote class=\"poem\"><p>As you set out for Ithaka<br>hope the voyage is a long one,<br>full of adventure, full of discovery.</p><footer>— C. P. Cavafy, \"Ithaka,\" translated by Edmund Keeley and Philip Sherrard</footer></blockquote><p>Amb aquest article he mostrat que, si tens prou indicadors agregats sobre un mateix fenomen i pots identificar quina funció de distribució estadística s'hi ajusta bé, tens la capacitat de generar microdades sintètiques a partir d'aquesta informació agregada.</p><p>Personalment, més que les microdades sintètiques en si, el més important ha estat tot el camí recorregut i els aprenentatges que me n’emporto. </p><p>Estem en l’any on la pel·lícula de Christopher Nolan “The Odyssey” ha estat segurament la pel·lícula de l’estiu. “The Odyssey” explica el viatge de retorn cap a casa, cap a Ítaca, d’Odisseu (o Ulisses per als romans) després de la victòria en la guerra de Troia, i crec que el poema “Ítaca” de Kavafis sobre aquest viatge reflecteix perfectament el que jo m’emporto de tot el “meu viatge” amb les dades sintètiques:</p><blockquote class=\"poem\"><p>Ithaka gave you the marvelous journey.<br>Without her you wouldn't have set out.</p><p>Wise as you will have become, so full of experience,<br>you'll have understood by then what these Ithakas mean.</p><footer>— C. P. Cavafy, \"Ithaka,\" translated by Edmund Keeley and Philip Sherrard</footer></blockquote>"}, {"title": "Agraïments.", "out": ["<p>Vull agrair a Mon Culleré els seus dibuixos, que hagi volgut dedicar part del seu temps lliure a fer els dibuixos que acompanyen l’explicació de tot el procés de generació de les dades sintètiques. </p>", "<p>També vull donar les gràcies a Jordi Boixader, Pep Canals i Ramon Arbós per apostar per aquesta idea de la qual ni jo mateix tenia clar si podria arribar a bon port. Aquests tipus d’apostes són les que realment ajuden a fer créixer a les persones, i les organitzacions on treballen aquestes persones.</p>"], "html": "<p>Vull agrair a Mon Culleré els seus dibuixos, que hagi volgut dedicar part del seu temps lliure a fer els dibuixos que acompanyen l’explicació de tot el procés de generació de les dades sintètiques. </p><p>També vull donar les gràcies a Jordi Boixader, Pep Canals i Ramon Arbós per apostar per aquesta idea de la qual ni jo mateix tenia clar si podria arribar a bon port. Aquests tipus d’apostes són les que realment ajuden a fer créixer a les persones, i les organitzacions on treballen aquestes persones.</p>"}]}, "en": {"title": "From Percentile to Person: Reconstructing the Income Distribution with Synthetic Data", "sub": "How to generate synthetic income microdata from aggregate income indicators", "sections": [{"title": "intro", "out": ["<figure class=\"fig\"><img src=\"img/fig1.jpeg\" loading=\"lazy\" alt=\"Image created by the author using ChatGPT (OpenAI).\"><figcaption>Image created by the author using ChatGPT (OpenAI).</figcaption></figure>", "<p class=\"lead\">In 2019, the Instituto Nacional de Estadística (INE, Spain's official statistical office) published an experimental statistic on household income in Spain for the first time. INE released a substantial number of income-related indicators at a very small territorial level, census sections (Spanish census sections are roughly equivalent to “census tracts” in the United States or “lower layer super output areas” in England and Wales). This data represented a major step forward for municipalities, since until then only municipal-level income estimates were available, but with this new experimental statistic, produced in collaboration with the Spanish Tax Agency, a level of territorial granularity previously unthinkable became possible.</p>", "<p>Even with this substantial improvement, for some municipal public policies this information is still not enough. I know the average or median income of a census section or a municipality, but I don’t know how income is actually distributed within that territory. And that difference is crucial when precisely identifying situations of poverty.</p>", "<p>In this context, I propose generating synthetic microdata as a way to “fill in the gaps” left by aggregate indicators.</p>"], "fns": [], "html": "<figure class=\"fig\"><img src=\"img/fig1.jpeg\" loading=\"lazy\" alt=\"Image created by the author using ChatGPT (OpenAI).\"><figcaption>Image created by the author using ChatGPT (OpenAI).</figcaption></figure><p class=\"lead\">In 2019, the Instituto Nacional de Estadística (INE, Spain's official statistical office) published an experimental statistic on household income in Spain for the first time. INE released a substantial number of income-related indicators at a very small territorial level, census sections (Spanish census sections are roughly equivalent to “census tracts” in the United States or “lower layer super output areas” in England and Wales). This data represented a major step forward for municipalities, since until then only municipal-level income estimates were available, but with this new experimental statistic, produced in collaboration with the Spanish Tax Agency, a level of territorial granularity previously unthinkable became possible.</p><p>Even with this substantial improvement, for some municipal public policies this information is still not enough. I know the average or median income of a census section or a municipality, but I don’t know how income is actually distributed within that territory. And that difference is crucial when precisely identifying situations of poverty.</p><p>In this context, I propose generating synthetic microdata as a way to “fill in the gaps” left by aggregate indicators.</p>"}, {"title": "The idea: a metaphor", "out": ["<figure class=\"fig\"><img src=\"img/fig2.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure>", "<p>If someone wants to go from Mataró to Manresa (two towns in Catalonia) and uses Google Maps, they get a detailed route, with every turn and every stretch perfectly defined, displayed on a beautifully drawn map. That would be the equivalent of having real microdata: I know exactly how income is distributed.</p>", "<figure class=\"fig\"><img src=\"img/fig3.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure>", "<p>But I often don’t have that level of detail. What I have are just a few reference points: I know roughly where Manresa is located, there are road signs telling me I’m heading toward Manresa, I know the distance between Mataró and Manresa, and I know roughly how long it will take to get there. This is more like following a marked trail, where I don’t have the complete route, but I do have enough clues to reconstruct it.</p>", "<p>In the case of income, the indicators that INE provides—these “reference points”—are the aggregate indicators (median, percentiles, etc.). The key is to use these indicators, together with a predefined distribution function, to reconstruct a plausible path: that is, a complete income distribution that is consistent with what I observe.</p>", "<figure class=\"fig\"><img src=\"img/fig4.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure>"], "html": "<figure class=\"fig\"><img src=\"img/fig2.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure><p>If someone wants to go from Mataró to Manresa (two towns in Catalonia) and uses Google Maps, they get a detailed route, with every turn and every stretch perfectly defined, displayed on a beautifully drawn map. That would be the equivalent of having real microdata: I know exactly how income is distributed.</p><figure class=\"fig\"><img src=\"img/fig3.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure><p>But I often don’t have that level of detail. What I have are just a few reference points: I know roughly where Manresa is located, there are road signs telling me I’m heading toward Manresa, I know the distance between Mataró and Manresa, and I know roughly how long it will take to get there. This is more like following a marked trail, where I don’t have the complete route, but I do have enough clues to reconstruct it.</p><p>In the case of income, the indicators that INE provides—these “reference points”—are the aggregate indicators (median, percentiles, etc.). The key is to use these indicators, together with a predefined distribution function, to reconstruct a plausible path: that is, a complete income distribution that is consistent with what I observe.</p><figure class=\"fig\"><img src=\"img/fig4.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure>"}, {"title": "The steps", "out": ["<p>The process of generating this synthetic microdata isn’t immediate—it requires several phases.</p>", "<p>First, I identify which distribution functions can adequately describe income. To do this, I carry out a literature review phase to understand which models have typically been used in this field (step 1).</p>", "<p>Next, I analyze the available income indicators to determine whether there are enough of them, and to what extent they contain sufficient information to recover the parameters of the distribution functions identified in the previous step (step 2). The income data provided by INE (Spain’s Household Income Distribution Atlas, available <a href=\"https://ine.es/dyngs/INEbase/en/operacion.htm?c=Estadistica_C&amp;cid=1254736177088&amp;menu=resultados&amp;idp=1254735976608\" target=\"_blank\" rel=\"noopener\"><strong>here</strong></a>) consists of 29
