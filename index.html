 indicators. With this goal in mind, I build a “statistical lab”: a controlled environment where I generate simulated data to check whether, starting from aggregate indicators, it is possible to recover the original shape of the distribution (step 3).</p>", "<p>Once the methodology is validated in this test environment, the next step is to apply it to real data. This lets me estimate the parameters of the income distribution functions for each municipality or census section (step 4).</p>", "<p>From these parameters, I generate synthetic microdata for Catalan municipalities that reproduce the observed indicators, but that provide a much higher level of detail (step 5).</p>", "<p>Finally, I aggregate the synthetic income microdata into higher-level territorial units such as “comarques” (an intermediate administrative division between the municipality and Catalonia, roughly comparable to a county, though with far less administrative weight), and also aggregate it for Catalonia as a whole. The goal is to see how the percentage of poor population in each municipality changes depending on which territorial reference level is used: the county, Catalonia, or Spain (step 6).</p>"], "html": "<p>The process of generating this synthetic microdata isn’t immediate—it requires several phases.</p><p>First, I identify which distribution functions can adequately describe income. To do this, I carry out a literature review phase to understand which models have typically been used in this field (step 1).</p><p>Next, I analyze the available income indicators to determine whether there are enough of them, and to what extent they contain sufficient information to recover the parameters of the distribution functions identified in the previous step (step 2). The income data provided by INE (Spain’s Household Income Distribution Atlas, available <a href=\"https://ine.es/dyngs/INEbase/en/operacion.htm?c=Estadistica_C&amp;cid=1254736177088&amp;menu=resultados&amp;idp=1254735976608\" target=\"_blank\" rel=\"noopener\"><strong>here</strong></a>) consists of 29 indicators. With this goal in mind, I build a “statistical lab”: a controlled environment where I generate simulated data to check whether, starting from aggregate indicators, it is possible to recover the original shape of the distribution (step 3).</p><p>Once the methodology is validated in this test environment, the next step is to apply it to real data. This lets me estimate the parameters of the income distribution functions for each municipality or census section (step 4).</p><p>From these parameters, I generate synthetic microdata for Catalan municipalities that reproduce the observed indicators, but that provide a much higher level of detail (step 5).</p><p>Finally, I aggregate the synthetic income microdata into higher-level territorial units such as “comarques” (an intermediate administrative division between the municipality and Catalonia, roughly comparable to a county, though with far less administrative weight), and also aggregate it for Catalonia as a whole. The goal is to see how the percentage of poor population in each municipality changes depending on which territorial reference level is used: the county, Catalonia, or Spain (step 6).</p>"}, {"title": "Step 1: Which distribution functions can describe income?", "out": ["<figure class=\"fig\"><img src=\"img/fig5.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure>", "<p>To generate synthetic income microdata from aggregate indicators, there’s one key question that needs answering before starting: <strong>what shape does the statistical distribution of income take?</strong></p>", "<p>The answer isn’t trivial, but I’m not starting from scratch either. Economic literature has been studying this question for decades, and today there’s a wide body of articles, books and working papers analyzing which distribution functions best fit income data. The general consensus is clear: to correctly model income, you need functions flexible enough to capture both the central part of the distribution and, above all, its tails, where much of the inequality is concentrated.</p>", "<h3><strong>The classics that still work</strong></h3>", "<p>Some of the most classic distributions are still a good starting point. The <strong>Lognormal</strong>, popularized by Aitchison and Brown in “<a href=\"https://ideas.repec.org/a/bla/jorssc/v6y1957i3p228-230.html\" target=\"_blank\" rel=\"noopener\"><em>The Lognormal Distribution with Special Reference to its Uses in Economics</em></a>” (1957), has been widely used to model the central part of the income distribution, especially under the hypothesis of multiplicative processes.</p>", "<p>The <strong>Gamma</strong> distribution has also played a relevant role as a flexible, relatively simple model, both in comparative studies and in specific applications such as poverty analysis. Along these lines, work such as “<a href=\"https://ideas.repec.org/p/pra/mprapa/69648.html\" target=\"_blank\" rel=\"noopener\"><em>Measuring poverty with the Foster, Greer and Thorbecke indexes based on the Gamma distribution</em></a>” (Fernández-Morales, 2016) shows its usefulness in applied contexts.</p>", "<p>The <strong>Weibull</strong>, although less common in income economics, appears in empirical studies such as Bandourian et al. (2002), where it delivers good results within parsimonious, low-parameter models.</p>", "<h3><strong>When the classics fall short</strong></h3>", "<p>The problem with these distributions is that, although they work reasonably well in the central part of the distribution, they often fail at a critical point: <strong>the tails</strong>, especially the upper tail. And this is where more flexible models come into play.</p>", "<p>The <strong>Pareto</strong> distribution has for decades been the standard tool for describing the upper end of the income distribution, and remains fundamental to inequality analysis. Extensions such as <strong>Pareto IV</strong> go a step further, introducing more flexibility without losing interpretability. In this work I use Pareto IV with its location parameter fixed at 0, which leaves three parameters: scale, inequality and shape.</p>", "<p>In parallel, the <strong>Dagum</strong> distribution, introduced by Camilo Dagum (1977, 1980), has established itself as one of the most robust options in empirical applications. In international comparisons, it appears recurrently among the functions that best fit the complete income distribution.</p>", "<h3><strong>The final selection</strong></h3>", "<p>With all this in mind, in the statistical lab I chose to work with five distribution functions that cover a wide spectrum of the literature:</p>", "<ul><li><strong>Lognormal and Gamma</strong>, as classic reference models.</li><li><strong>Weibull</strong>, as a parsimonious alternative.</li><li><strong>Dagum</strong>, as a flexible model with good overall behavior.</li><li><strong>Pareto IV</strong>, as an extension to adequately capture the tails.</li></ul>", "<p>This selection makes it possible to compare different approaches with varying levels of complexity and flexibility, while keeping a viable approach in a context with only aggregate information.</p>"], "html": "<figure class=\"fig\"><img src=\"img/fig5.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure><p>To generate synthetic income microdata from aggregate indicators, there’s one key question that needs answering before starting: <strong>what shape does the statistical distribution of income take?</strong></p><p>The answer isn’t trivial, but I’m not starting from scratch either. Economic literature has been studying this question for decades, and today there’s a wide body of articles, books and working papers analyzing which distribution functions best fit income data. The general consensus is clear: to correctly model income, you need functions flexible enough to capture both the central part of the distribution and, above all, its tails, where much of the inequality is concentrated.</p><h3><strong>The classics that still work</strong></h3><p>Some of the most classic distributions are still a good starting point. The <strong>Lognormal</strong>, popularized by Aitchison and Brown in “<a href=\"https://ideas.repec.org/a/bla/jorssc/v6y1957i3p228-230.html\" target=\"_blank\" rel=\"noopener\"><em>The Lognormal Distribution with Special Reference to its Uses in Economics</em></a>” (1957), has been widely used to model the central part of the income distribution, especially under the hypothesis of multiplicative processes.</p><p>The <strong>Gamma</strong> distribution has also played a relevant role as a flexible, relatively simple model, both in comparative studies and in specific applications such as poverty analysis. Along these lines, work such as “<a href=\"https://ideas.repec.org/p/pra/mprapa/69648.html\" target=\"_blank\" rel=\"noopener\"><em>Measuring poverty with the Foster, Greer and Thorbecke indexes based on the Gamma distribution</em></a>” (Fernández-Morales, 2016) shows its usefulness in applied contexts.</p><p>The <strong>Weibull</strong>, although less common in income economics, appears in empirical studies such as Bandourian et al. (2002), where it delivers good results within parsimonious, low-parameter models.</p><h3><strong>When the classics fall short</strong></h3><p>The problem with these distributions is that, although they work reasonably well in the central part of the distribution, they often fail at a critical point: <strong>the tails</strong>, especially the upper tail. And this is where more flexible models come into play.</p><p>The <strong>Pareto</strong> distribution has for decades been the standard tool for describing the upper end of the income distribution, and remains fundamental to inequality analysis. Extensions such as <strong>Pareto IV</strong> go a step further, introducing more flexibility without losing interpretability. In this work I use Pareto IV with its location parameter fixed at 0, which leaves three parameters: scale, inequality and shape.</p><p>In parallel, the <strong>Dagum</strong> distribution, introduced by Camilo Dagum (1977, 1980), has established itself as one of the most robust options in empirical applications. In international comparisons, it appears recurrently among the functions that best fit the complete income distribution.</p><h3><strong>The final selection</strong></h3><p>With all this in mind, in the statistical lab I chose to work with five distribution functions that cover a wide spectrum of the literature:</p><ul><li><strong>Lognormal and Gamma</strong>, as classic reference models.</li><li><strong>Weibull</strong>, as a parsimonious alternative.</li><li><strong>Dagum</strong>, as a flexible model with good overall behavior.</li><li><strong>Pareto IV</strong>, as an extension to adequately capture the tails.</li></ul><p>This selection makes it possible to compare different approaches with varying levels of complexity and flexibility, while keeping a viable approach in a context with only aggregate information.</p>"}, {"title": "Step 2: Analysis of the available data", "out": ["<p>The income data provided by INE consists of 29 indicators. Of these 29, seven are demographic indicators, leaving 22 indicators specifically related to income. These are the 22 income indicators that INE provides:</p>", "<ul><li>Gini index</li><li>P80/P20 income distribution ratio</li><li>Average net income per person</li><li>Average net income per household</li><li>Average income per consumption unit</li><li>Median income per consumption unit</li><li>Average gross income per person</li><li>Average gross income per household</li><li>Income source: wages</li><li>Income source: pensions</li><li>Income source: unemployment benefits</li><li>Income source: other benefits</li><li>Income source: other income</li><li>Population with income per consumption unit below €5,000</li><li>Population with income per consumption unit below €7,500</li><li>Population with income per consumption unit below €10,000</li><li>Population with income per consumption unit below 40% of the median</li><li>Population with income per consumption unit below 50% of the median</li><li>Population with income per consumption unit below 60% of the median</li><li>Population with income per consumption unit above 140% of the median</li><li>Population with income per consumption unit above 160% of the median</li><li>Population with income per consumption unit above 200% of the median</li></ul>", "<p>As you can see, the indicator for population below or above certain income-per-consumption-unit thresholds is the one that appears most often, so that’s the data I model. I also add the median income per consumption unit, which tells me the income value below which 50% of the population falls.</p>", "<p>When I talk about income “per consumption unit,” I don’t simply mean income divided by the number of people in the household. INE uses the OECD-modified equivalence scale, which assigns a weight of 1 to the first adult in the household, 0.5 to each additional member aged 14 or over, and 0.3 to each member under 14. Total household income is divided by the sum of these weights, and the result—the equivalized income—is assigned equally to everyone living in the household. This adjustment recognizes that sharing a household brings economies of scale (you don’t need double the floor space or double the utilities to house twice as many people), and it’s the standard used by both INE and Eurostat to make households of very different compositions comparable.</p>"], "html": "<p>The income data provided by INE consists of 29 indicators. Of these 29, seven are demographic indicators, leaving 22 indicators specifically related to income. These are the 22 income indicators that INE provides:</p><ul><li>Gini index</li><li>P80/P20 income distribution ratio</li><li>Average net income per person</li><li>Average net income per household</li><li>Average income per consumption unit</li><li>Median income per consumption unit</li><li>Average gross income per person</li><li>Average gross income per household</li><li>Income source: wages</li><li>Income source: pensions</li><li>Income source: unemployment benefits</li><li>Income source: other benefits</li><li>Income source: other income</li><li>Population with income per consumption unit below €5,000</li><li>Population with income per consumption unit below €7,500</li><li>Population with income per consumption unit below €10,000</li><li>Population with income per consumption unit below 40% of the median</li><li>Population with income per consumption unit below 50% of the median</li><li>Population with income per consumption unit below 60% of the median</li><li>Population with income per consumption unit above 140% of the median</li><li>Population with income per consumption unit above 160% of the median</li><li>Population with income per consumption unit above 200% of the median</li></ul><p>As you can see, the indicator for population below or above certain income-per-consumption-unit thresholds is the one that appears most often, so that’s the data I model. I also add the median income per consumption unit, which tells me the income value below which 50% of the population falls.</p><p>When I talk about income “per consumption unit,” I don’t simply mean income divided by the number of people in the household. INE uses the OECD-modified equivalence scale, which assigns a weight of 1 to the first adult in the household, 0.5 to each additional member aged 14 or over, and 0.3 to each member under 14. Total household income is divided by the sum of these weights, and the result—the equivalized income—is assigned equally to everyone living in the household. This adjustment recognizes that sharing a household brings economies of scale (you don’t need double the floor space or double the utilities to house twice as many people), and it’s the standard used by both INE and Eurostat to make households of very different compositions comparable.</p>"}, {"title": "Step 3: The statistical lab", "out": ["<figure class=\"fig\"><img src=\"img/fig6.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure>", "<p>Since I don’t know the true income distribution behind INE’s Household Income Distribution Atlas data, I decided to create a <strong>statistical lab</strong> to run a robustness test. The idea is simple: put different models to the test to see which ones are the most flexible and reliable.</p>", "<p>To do this, I generated synthetic scenarios using the five distributions mentioned above: Dagum, Pareto IV, Lognormal, Gamma and Weibull. For each of these distribution functions I calculated ten reference indicators. Using a <strong>loss function</strong>, I analyzed how well each model fit these indicators, whether or not the fitting function matched the original one. After 50 trials (10 per distribution), the goal was clear: <strong>pick the two most versatile functions</strong> to then apply, this time for real, to the actual data from the Household Income Distribution Atlas.</p>", "<p>I’ve summarized the lab results for the five distribution functions in the loss table below, where the rows show the “true” distribution used to generate the data, and the columns show the distribution I tried to fit to it. The value in each cell is the mean error obtained across the 10 trials.</p>", "<figure class=\"fig fig-table\"><img src=\"img/fig7_en.png\" loading=\"lazy\" alt=\"Income estimation error matrix: rows show the true distribution, columns the fitted distribution\"></figure>", "<p>As expected, the diagonal values are the lowest: when a distribution is estimated using data generated by that same distribution, the error is minimal. The only notable exception is Pareto IV, where Dagum achieves a slightly lower error. This doesn’t mean Dagum describes the upper tail better than Pareto IV itself—rather, it means Pareto IV’s fit is less stable with a limited number of aggregate indicators. Looking at the mean of each column, the two distributions with the lowest mean error are Dagum and Pareto IV, with errors of 0.0945 and 0.3084 respectively.</p>", "<p>Since in reality I don’t know which distribution function income follows in each municipality or census section, and fitting five different models to every territory would be inefficient, my objective with the lab was twofold: on one hand, to verify that it’s actually feasible to recover the statistical distribution function from the indicators INE provides; and on the other, to identify which two distribution functions offer the best overall fit, regardless of the true nature of the underlying data. In essence, it’s about selecting the most robust tools—the ones that guarantee me the lowest error across the widest possible range of scenarios. The table’s results show that the best fits are achieved by the Dagum and Pareto IV distribution functions.</p>", "<p>So these two distribution functions (Dagum and Pareto IV) are the ones I’ll use to obtain the parameters for each Catalan municipality.</p>"], "html": "<figure class=\"fig\"><img src=\"img/fig6.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure><p>Since I don’t know the true income distribution behind INE’s Household Income Distribution Atlas data, I decided to create a <strong>statistical lab</strong> to run a robustness test. The idea is simple: put different models to the test to see which ones are the most flexible and reliable.</p><p>To do this, I generated synthetic scenarios using the five distributions mentioned above: Dagum, Pareto IV, Lognormal, Gamma and Weibull. For each of these distribution functions I calculated ten reference indicators. Using a <strong>loss function</strong>, I analyzed how well each model fit these indicators, whether or not the fitting function matched the original one. After 50 trials (10 per distribution), the goal was clear: <strong>pick the two most versatile functions</strong> to then apply, this time for real, to the actual data from the Household Income Distribution Atlas.</p><p>I’ve summarized the lab results for the five distribution functions in the loss table below, where the rows show the “true” distribution used to generate the data, and the columns show the distribution I tried to fit to it. The value in each cell is the mean error obtained across the 10 trials.</p><figure class=\"fig fig-table\"><img src=\"img/fig7_en.png\" loading=\"lazy\" alt=\"Income estimation error matrix: rows show the true distribution, columns the fitted distribution\"></figure><p>As expected, the diagonal values are the lowest: when a distribution is estimated using data generated by that same distribution, the error is minimal. The only notable exception is Pareto IV, where Dagum achieves a slightly lower error. This doesn’t mean Dagum describes the upper tail better than Pareto IV itself—rather, it means Pareto IV’s fit is less stable with a limited number of aggregate indicators. Looking at the mean of each column, the two distributions with the lowest mean error are Dagum and Pareto IV, with errors of 0.0945 and 0.3084 respectively.</p><p>Since in reality I don’t know which distribution function income follows in each municipality or census section, and fitting five different models to every territory would be inefficient, my objective with the lab was twofold: on one hand, to verify that it’s actually feasible to recover the statistical distribution function from the indicators INE provides; and on the other, to identify which two distribution functions offer the best overall fit, regardless of the true nature of the underlying data. In essence, it’s about selecting the most robust tools—the ones that guarantee me the lowest error across the widest possible range of scenarios. The table’s results show that the best fits are achieved by the Dagum and Pareto IV distribution functions.</p><p>So these two distribution functions (Dagum and Pareto IV) are the ones I’ll use to obtain the parameters for each Catalan municipality.</p>"}, {"title": "Step 4: Production—obtaining the parameters from the income indicators", "out": ["<figure class=\"fig\"><img src=\"img/fig8.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure>", "<p>Once the statistical lab has demonstrated that recovering the parameters is feasible, and has shown that the Dagum and Pareto IV distributions fit best, the next step is to move to the “real world”—that is, to use the income indicators INE provides to obtain the Dagum and Pareto IV distribution parameters for every Catalan municipality with a complete set of income-per-consumption-unit indicators.</p>", "<p>Catalonia has 947 municipalities and 8.2 million inhabitants, but only 614 Catalan municipalities have the complete set of income-per-consumption-unit indicators, and these 614 municipalities together account for nearly 7.8 million inhabitants.</p>", "<p>Unlike in the statistical lab, here the loss function I used to fit INE’s data incorporates a quadratic penalty to keep the parameters within economically reasonable bounds:</p>", "<div class=\"eq\">\\[L_{\\text{total}}(\\theta)=L_{\\text{indicators}}(x(\\theta))+P_{\\text{boundary}}(x(\\theta))\\]</div>", "<p>Where:</p>", "<ul><li>\\(\\theta\\in\\mathbb{R}^{K}\\) represents the parameter vector in the unbounded space used by the numerical optimizer.</li><li>\\(x(\\theta)\\) is the vector of real economic parameters. The transformation isn’t uniform: for the shape and scale parameters (shape1, shape2 and scale in Dagum; scale and shape in Pareto IV), an exponential is applied, which guarantees they stay positive but sets no upper bound. Pareto IV’s inequality parameter, on the other hand, is transformed with a logistic function that does strictly bound it within the [lb, ub] range. This is why the <em>P</em><em><sub>boundary</sub></em> penalty is needed: except for inequality (already bounded by construction), the exponential transformation alone doesn’t stop the optimizer from exploring shapes or scales outside economically reasonable bounds.</li><li>\\(L_{\\text{indicators}}\\) is the sum of squared relative errors.</li><li>\\(P_{\\text{boundary}}\\)is the penalty for exceeding the fixed thresholds on the parameters.</li></ul>", "<p>The first component of the loss function measures the sum of squared relative errors against the indicators from INE’s Household Income Distribution Atlas. Each indicator’s error is weighted by a specific weight (<em>w</em><em><sub>j</sub></em>). A constant epsilon, with a value of 10<sup>-6</sup>, is added to the denominator to avoid divisions by zero and keep the calculation stable.</p>", "<div class=\"eq\">\\[L_{\\text{indicators}}(x)=\\sum_{j=1}^{J} w_j\\cdot\\left(\\frac{\\hat I_j(x)-I_j}{I_j+\\epsilon}\\right)^{2}\\]</div>", "<p>Where:</p>", "<ul><li><em>j</em> refers to the list of indicators being evaluated (population with income per consumption unit below €5,000; below €7,500; below €10,000; below 40% of the median; below 50% of the median; below 60% of the median; above 140% of the median; above 160% of the median; above 200% of the median; median income per consumption unit; the Gini index; and P80/P20).</li><li>\\(I_j\\) is the value of each indicator as provided by INE’s Income Distribution Atlas.</li><li>\\(\\hat I_j\\)is the estimated value of each indicator.</li><li>\\(\\epsilon\\) is a constant with a value of 10<em><sup>-6</sup></em>.</li></ul>", "<p>The second component is a soft penalty that kicks in when parameters move outside their defined bounds. In the calculation algorithm, the Dagum and Pareto IV parameters are bounded both from below and above. The goal is to avoid extreme values that might reduce the mathematical error but make no sense from an economic standpoint.</p>", "<p>This matters especially because the BFGS<sup class=\"fnref\"><a href=\"#fn1\" id=\"fnr1\">1</a></sup> algorithm is an unbounded quasi-Newton optimizer. In practical terms, that means it moves freely through the parameter space: it proposes values, computes the loss function, estimates which direction reduces the error, and proposes new values again. Left unchecked, it can end up exploring absurd combinations simply because they numerically reduce the error. The penalty acts as a fence: it doesn’t fully block movement, but it makes straying outside the reasonable range costly.</p>", "<div class=\"eq\">\\[P_{\\text{boundary}}(x)=\\lambda\\cdot\\sum_{k=1}^{K}\\left[\\left(\\frac{\\max(0,\\,lb_k-x_k)}{ub_k-lb_k}\\right)^{2}+\\left(\\frac{\\max(0,\\,x_k-ub_k)}{ub_k-lb_k}\\right)^{2}\\right]\\]</div>", "<p>Where:</p>", "<ul><li><em>k</em> refers to each of the distribution function’s parameters.</li><li>\\(\\lambda\\) is the penalty applied for exceeding the thresholds set on the parameters.</li><li>\\(lb_k\\) and \\(ub_k\\)are the lower and upper thresholds assigned to the parameters.</li><li>\\(x_k\\) is the value of parameter <em>k</em> the computer is testing at that point in the iteration.</li></ul>", "<p>On top of this control, for each municipality I don’t make a single fitting attempt—I repeat the full calculation 40 times for Dagum and 60 times for Pareto IV, each time starting from a different starting point and letting the algorithm run down to its minimum for each starting value, before finally keeping whichever result shows the best fit overall. This multi-start approach greatly reduces the risk of settling for a solution that looks good but isn’t actually the best one possible. Each individual run stops once it reaches 400 iterations, or earlier if the improvement between two consecutive iterations is minimal (below 0.00000001).</p>", "<p>Using more starting values for Pareto IV than for Dagum reflects something I observed in the statistical lab: it’s more costly for a Pareto IV fit to find a good minimum, as shown by the fact that Pareto IV’s mean error was considerably higher than Dagum’s.</p>", "<p>Although the loss function allows weighting each indicator differently, in this application I chose to assign the same weight to every indicator used. The one exception is the Gini coefficient, which I excluded from the loss function by assigning it a weight of \\(w_{\\text{Gini}}=0\\). The reason is that there’s no closed-form expression for computing the winsorized Gini index (a Gini computed after capping extreme incomes at a given percentile), which is the indicator INE provides. The only way to calculate it is through Monte Carlo simulations based on random draws, and that has two implications: on one hand, running Monte Carlo simulations to compute the winsorized Gini index is computationally expensive; and on the other, because that data is generated randomly, the loss function stops being deterministic at that point—which clashes with the BFGS algorithm, which assumes the function it’s optimizing is deterministic, so the noise generated by the random data destabilizes the convergence BFGS is trying to reach.</p>", "<p>The table below shows the estimated parameter values for the first 10 Catalan municipalities in alphabetical order, along with several fit-quality indicators. The <em><strong>mean error</strong></em> is the average of the differences, in percentage points, between the simulation and INE’s data across the income-per-consumption-unit indicators. The <em><strong>max error</strong></em> captures the largest difference observed in each municipality among the nine income-per-consumption-unit indicators. The <em><strong>median income error</strong></em> measures the percentage deviation between the model’s estimated median income and the median published by INE. The <em><strong>P80/P20 error</strong></em> shows the percentage error in the P80/P20 inequality ratio. Finally, the <em><strong>final loss</strong></em> is the value of the objective function once the optimization algorithm has finished.</p>", "<figure class=\"fig fig-table\"><img src=\"img/fig9_en.png\" loading=\"lazy\" alt=\"Fit comparison table, Dagum vs. Pareto IV, for the first 10 municipalities of Catalonia\"></figure>"], "html": "<figure class=\"fig\"><img src=\"img/fig8.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure><p>Once the statistical lab has demonstrated that recovering the parameters is feasible, and has shown that the Dagum and Pareto IV distributions fit best, the next step is to move to the “real world”—that is, to use the income indicators INE provides to obtain the Dagum and Pareto IV distribution parameters for every Catalan municipality with a complete set of income-per-consumption-unit indicators.</p><p>Catalonia has 947 municipalities and 8.2 million inhabitants, but only 614 Catalan municipalities have the complete set of income-per-consumption-unit indicators, and these 614 municipalities together account for nearly 7.8 million inhabitants.</p><p>Unlike in the statistical lab, here the loss function I used to fit INE’s data incorporates a quadratic penalty to keep the parameters within economically reasonable bounds:</p><div class=\"eq\">\\[L_{\\text{total}}(\\theta)=L_{\\text{indicators}}(x(\\theta))+P_{\\text{boundary}}(x(\\theta))\\]</div><p>Where:</p><ul><li>\\(\\theta\\in\\mathbb{R}^{K}\\) represents the parameter vector in the unbounded space used by the numerical optimizer.</li><li>\\(x(\\theta)\\) is the vector of real economic parameters. The transformation isn’t uniform: for the shape and scale parameters (shape1, shape2 and scale in Dagum; scale and shape in Pareto IV), an exponential is applied, which guarantees they stay positive but sets no upper bound. Pareto IV’s inequality parameter, on the other hand, is transformed with a logistic function that does strictly bound it within the [lb, ub] range. This is why the <em>P</em><em><sub>boundary</sub></em> penalty is needed: except for inequality (already bounded by construction), the exponential transformation alone doesn’t stop the optimizer from exploring shapes or scales outside economically reasonable bounds.</li><li>\\(L_{\\text{indicators}}\\) is the sum of squared relative errors.</li><li>\\(P_{\\text{boundary}}\\) is the penalty for exceeding the fixed thresholds on the parameters.</li></ul><p>The first component of the loss function measures the sum of squared relative errors against the indicators from INE’s Household Income Distribution Atlas. Each indicator’s error is weighted by a specific weight (<em>w</em><em><sub>j</sub></em>). A constant epsilon, with a value of 10<sup>-6</sup>, is added to the denominator to avoid divisions by zero and keep the calculation stable.</p><div class=\"eq\">\\[L_{\\text{indicators}}(x)=\\sum_{j=1}^{J} w_j\\cdot\\left(\\frac{\\hat I_j(x)-I_j}{I_j+\\epsilon}\\right)^{2}\\]</div><p>Where:</p><ul><li><em>j</em> refers to the list of indicators being evaluated (population with income per consumption unit below €5,000; below €7,500; below €10,000; below 40% of the median; below 50% of the median; below 60% of the median; above 140% of the median; above 160% of the median; above 200% of the median; median income per consumption unit; the Gini index; and P80/P20).</li><li>\\(I_j\\) is the value of each indicator as provided by INE’s Income Distribution Atlas.</li><li>\\(\\hat I_j\\) is the estimated value of each indicator.</li><li>\\(\\epsilon\\) is a constant with a value of 10<em><sup>-6</sup></em>.</li></ul><p>The second component is a soft penalty that kicks in when parameters move outside their defined bounds. In the calculation algorithm, the Dagum and Pareto IV parameters are bounded both from below and above. The goal is to avoid extreme values that might reduce the mathematical error but make no sense from an economic standpoint.</p><p>This matters especially because the BFGS<sup class=\"fnref\"><a href=\"#fn1\" id=\"fnr1\">1</a></sup> algorithm is an unbounded quasi-Newton optimizer. In practical terms, that means it moves freely through the parameter space: it proposes values, computes the loss function, estimates which direction reduces the error, and proposes new values again. Left unchecked, it can end up exploring absurd combinations simply because they numerically reduce the error. The penalty acts as a fence: it doesn’t fully block movement, but it makes straying outside the reasonable range costly.</p><div class=\"eq\">\\[P_{\\text{boundary}}(x)=\\lambda\\cdot\\sum_{k=1}^{K}\\left[\\left(\\frac{\\max(0,\\,lb_k-x_k)}{ub_k-lb_k}\\right)^{2}+\\left(\\frac{\\max(0,\\,x_k-ub_k)}{ub_k-lb_k}\\right)^{2}\\right]\\]</div><p>Where:</p><ul><li><em>k</em> refers to each of the distribution function’s parameters.</li><li>\\(\\lambda\\) is the penalty applied for exceeding the thresholds set on the parameters.</li><li>\\(lb_k\\) and \\(ub_k\\) are the lower and upper thresholds assigned to the parameters.</li><li>\\(x_k\\) is the value of parameter <em>k</em> the computer is testing at that point in the iteration.</li></ul><p>On top of this control, for each municipality I don’t make a single fitting attempt—I repeat the full calculation 40 times for Dagum and 60 times for Pareto IV, each time starting from a different starting point and letting the algorithm run down to its minimum for each starting value, before finally keeping whichever result shows the best fit overall. This multi-start approach greatly reduces the risk of settling for a solution that looks good but isn’t actually the best one possible. Each individual run stops once it reaches 400 iterations, or earlier if the improvement between two consecutive iterations is minimal (below 0.00000001).</p><p>Using more starting values for Pareto IV than for Dagum reflects something I observed in the statistical lab: it’s more costly for a Pareto IV fit to find a good minimum, as shown by the fact that Pareto IV’s mean error was considerably higher than Dagum’s.</p><p>Although the loss function allows weighting each indicator differently, in this application I chose to assign the same weight to every indicator used. The one exception is the Gini coefficient, which I excluded from the loss function by assigning it a weight of \\(w_{\\text{Gini}}=0\\). The reason is that there’s no closed-form expression for computing the winsorized Gini index (a Gini computed after capping extreme incomes at a given percentile), which is the indicator INE provides. The only way to calculate it is through Monte Carlo simulations based on random draws, and that has two implications: on one hand, running Monte Carlo simulations to compute the winsorized Gini index is computationally expensive; and on the other, because that data is generated randomly, the loss function stops being deterministic at that point—which clashes with the BFGS algorithm, which assumes the function it’s optimizing is deterministic, so the noise generated by the random data destabilizes the convergence BFGS is trying to reach.</p><p>The table below shows the estimated parameter values for the first 10 Catalan municipalities in alphabetical order, along with several fit-quality indicators. The <em><strong>mean error</strong></em> is the average of the differences, in percentage points, between the simulation and INE’s data across the income-per-consumption-unit indicators. The <em><strong>max error</strong></em> captures the largest difference observed in each municipality among the nine income-per-consumption-unit indicators. The <em><strong>median income error</strong></em> measures the percentage deviation between the model’s estimated median income and the median published by INE. The <em><strong>P80/P20 error</strong></em> shows the percentage error in the P80/P20 inequality ratio. Finally, the <em><strong>final loss</strong></em> is the value of the objective function once the optimization algorithm has finished.</p><figure class=\"fig fig-table\"><img src=\"img/fig9_en.png\" loading=\"lazy\" alt=\"Fit comparison table, Dagum vs. Pareto IV, for the first 10 municipalities of Catalonia\"></figure><aside class=\"footnotes\"><ol start=\"1\"><li id=\"fn1\">Broyden–Fletcher–Goldfarb–Shanno (BFGS) algorithm. <a href=\"#fnr1\" class=\"back\" aria-label=\"↩\">↩</a></li></ol></aside>"}, {"title": "Step 5: Generating synthetic income microdata at the municipal level", "out": ["<figure class=\"fig\"><img src=\"img/fig10.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure>", "<p>Once I’ve calculated the parameters of each income distribution function (Dagum and Pareto IV) for every Catalan municipality, the next step is trivial: it simply consists of generating as many income-per-consumption-unit values as there are inhabitants in the municipality, using the parameters obtained in the previous step. And for each municipality, with the same parameters, I can generate as much synthetic data as I want, which is quite interesting since it lets me check how much the results change from one random draw to another (Monte Carlo variability). Software such as Python or, as in this case, R, offers packages with functions to generate data following the Pareto IV and Dagum statistical distributions; for this particular project I used the VGAM package.</p>"], "html": "<figure class=\"fig\"><img src=\"img/fig10.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure><p>Once I’ve calculated the parameters of each income distribution function (Dagum and Pareto IV) for every Catalan municipality, the next step is trivial: it simply consists of generating as many income-per-consumption-unit values as there are inhabitants in the municipality, using the parameters obtained in the previous step. And for each municipality, with the same parameters, I can generate as much synthetic data as I want, which is quite interesting since it lets me check how much the results change from one random draw to another (Monte Carlo variability). Software such as Python or, as in this case, R, offers packages with functions to generate data following the Pareto IV and Dagum statistical distributions; for this particular project I used the VGAM package.</p>"}, {"title": "Step 6: Calculating the percentage of population below the poverty threshold", "out": ["<figure class=\"fig\"><img src=\"img/fig11.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure>", "<p>And what’s all this for? There’s a convention adopted by Eurostat (the European statistical agency) and the European Union (and followed by INE) that sets the at-risk-of-poverty threshold at 60% of the median income per consumption unit. This is indeed one of the indicators INE provides, but the problem is that the median INE uses is the one for Spain as a whole, and anyone who knows Spain a little will know that some regions have higher incomes than others (as happens in so many other countries). Catalonia’s income is among the highest in Spain, so when the Spanish median income is used as the reference, the percentage of the Catalan population found below 60% of the Spanish median income is lower than the percentage that would be found if 60% of the Catalan median income were used as the threshold instead.</p>", "<p>Having synthetic income microdata for every Catalan municipality lets me generate different poverty thresholds using different territorial reference levels. So, below, I present three maps of Catalonia’s municipalities showing the percentage of population below the poverty threshold, where that threshold differs depending on whether the territorial reference level is the county, Catalonia, or Spain.</p>", "<figure class=\"fig fig-row\"><img src=\"img/fig12.png\" loading=\"lazy\" alt=\"\"><img src=\"img/fig13.png\" loading=\"lazy\" alt=\"\"><img src=\"img/fig14.png\" loading=\"lazy\" alt=\"\"></figure>", "<p>The results for Catalonia as a whole are summarized in the table below.</p>", "<figure class=\"fig fig-table\"><img src=\"img/fig15.png\" loading=\"lazy\" alt=\"\"></figure>", "<p>The table shows that using the Spain-wide median, the percentage of the population below the poverty threshold in Catalonia stands at 17.4%, while using the Catalonia median the poverty rate is close to 21%, and using the county median it stands at 20.7%. Although the percentages for Catalonia as a whole are quite similar whether the county median or the Catalonia median is used, the main differences show up territorially, as the maps illustrate: counties close to the capital, Barcelona, show higher percentages of population below 60% of the median income when using the county-level threshold than when using the Catalonia-wide threshold.</p>"], "html": "<figure class=\"fig\"><img src=\"img/fig11.png\" loading=\"lazy\" alt=\"Image created by Mon Culleré Córdoba.\"><figcaption>Image created by Mon Culleré Córdoba.</figcaption></figure><p>And what’s all this for? There’s a convention adopted by Eurostat (the European statistical agency) and the European Union (and followed by INE) that sets the at-risk-of-poverty threshold at 60% of the median income per consumption unit. This is indeed one of the indicators INE provides, but the problem is that the median INE uses is the one for Spain as a whole, and anyone who knows Spain a little will know that some regions have higher incomes than others (as happens in so many other countries). Catalonia’s income is among the highest in Spain, so when the Spanish median income is used as the reference, the percentage of the Catalan population found below 60% of the Spanish median income is lower than the percentage that would be found if 60% of the Catalan median income were used as the threshold instead.</p><p>Having synthetic income microdata for every Catalan municipality lets me generate different poverty thresholds using different territorial reference levels. So, below, I present three maps of Catalonia’s municipalities showing the percentage of population below the poverty threshold, where that threshold differs depending on whether the territorial reference level is the county, Catalonia, or Spain.</p><figure class=\"fig fig-row\"><img src=\"img/fig12.png\" loading=\"lazy\" alt=\"\"><img src=\"img/fig13.png\" loading=\"lazy\" alt=\"\"><img src=\"img/fig14.png\" loading=\"lazy\" alt=\"\"></figure><p>The results for Catalonia as a whole are summarized in the table below.</p><figure class=\"fig fig-table\"><img src=\"img/fig15.png\" loading=\"lazy\" alt=\"\"></figure><p>The table shows that using the Spain-wide median, the percentage of the population below the poverty threshold in Catalonia stands at 17.4%, while using the Catalonia median the poverty rate is close to 21%, and using the county median it stands at 20.7%. Although the percentages for Catalonia as a whole are quite similar whether the county median or the Catalonia median is used, the main differences show up territorially, as the maps illustrate: counties close to the capital, Barcelona, show higher percentages of population below 60% of the median income when using the county-level threshold than when using the Catalonia-wide threshold.</p>"}, {"title": "Final thoughts", "out": ["<blockquote class=\"poem\"><p><em>As you set out for Ithaka</em></p><p><em>hope the voyage is a long one,</em></p><p><em>full of adventure, full of discovery.</em></p><footer>— C. P. Cavafy, “Ithaka,” translated by Edmund Keeley and Philip Sherrard</footer></blockquote>", "<p>In this article, I have illustrated how, if you have enough aggregate indicators about the same phenomenon and can identify a statistical distribution that fits them well, it is possible to generate plausible synthetic microdata from that aggregate information.</p>", "<p>Personally, more than the synthetic microdata itself, what has mattered most is the whole path I’ve walked and everything I’ve learned along the way.</p>", "<p>This year, Christopher Nolan’s “The Odyssey” has arguably been the movie of the summer. “The Odyssey” tells the story of Odysseus’s (or Ulysses, as the Romans called him) journey home to Ithaca after his victory in the Trojan War, and I think Cavafy’s poem “Ithaka,” about that very journey, perfectly captures what I take away from my own “journey” with synthetic data:</p>", "<blockquote class=\"poem\"><p><em>Ithaka gave you the marvelous journey.</em></p><p><em>Without her you wouldn’t have set out.</em></p><p><em>Wise as you will have become, so full of experience,</em></p><p><em>you’ll have understood by then what these Ithakas mean.</em></p><footer>— C. P. Cavafy, “Ithaka,” translated by Edmund Keeley and Philip Sherrard</footer></blockquote>"], "html": "<blockquote class=\"poem\"><p><em>As you set out for Ithaka</em></p><p><em>hope the voyage is a long one,</em></p><p><em>full of adventure, full of discovery.</em></p><footer>— C. P. Cavafy, “Ithaka,” translated by Edmund Keeley and Philip Sherrard</footer></blockquote><p>In this article, I have illustrated how, if you have enough aggregate indicators about the same phenomenon and can identify a statistical distribution that fits them well, it is possible to generate plausible synthetic microdata from that aggregate information.</p><p>Personally, more than the synthetic microdata itself, what has mattered most is the whole path I’ve walked and everything I’ve learned along the way.</p><p>This year, Christopher Nolan’s “The Odyssey” has arguably been the movie of the summer. “The Odyssey” tells the story of Odysseus’s (or Ulysses, as the Romans called him) journey home to Ithaca after his victory in the Trojan War, and I think Cavafy’s poem “Ithaka,” about that very journey, perfectly captures what I take away from my own “journey” with synthetic data:</p><blockquote class=\"poem\"><p><em>Ithaka gave you the marvelous journey.</em></p><p><em>Without her you wouldn’t have set out.</em></p><p><em>Wise as you will have become, so full of experience,</em></p><p><em>you’ll have understood by then what these Ithakas mean.</em></p><footer>— C. P. Cavafy, “Ithaka,” translated by Edmund Keeley and Philip Sherrard</footer></blockquote>"}, {"title": "Acknowledgements", "out": ["<p>I would like to thank Mon Culleré for the drawings, and for generously devoting part of his free time to creating the illustrations that accompany the explanation of the entire synthetic data generation process.</p>", "<p>I would also like to thank Jordi Boixader, Pep Canals and Ramon Arbós for backing this idea, which even I was not sure would ever come to fruition. It is this kind of bet that truly helps people grow, along with the organizations they work for.</p>"], "html": "<p>I would like to thank Mon Culleré for the drawings, and for generously devoting part of his free time to creating the illustrations that accompany the explanation of the entire synthetic data generation process.</p><p>I would also like to thank Jordi Boixader, Pep Canals and Ramon Arbós for backing this idea, which even I was not sure would ever come to fruition. It is this kind of bet that truly helps people grow, along with the organizations they work for.</p>"}]}};

const $ = s => document.querySelector(s);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang = store.get('lang') || ((navigator.language||'ca').toLowerCase().startsWith('en') ? 'en' : 'ca');
const params = new URLSearchParams(location.search); if (['ca','en'].includes(params.get('lang'))) lang = params.get('lang');

const fmt = (x,d=2) => x.toLocaleString(lang==='ca'?'es-ES':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

function label(s,i){
  if (i===0) return {n:'', t:UI[lang].intro};
  const m = s.title.match(/^(Pas|Step)\s+(\d)\s*[.:]\s*(.*?)\.?$/);
  if (m) return {n:m[2], t:m[3]};
  return {n:'', t:s.title.replace(/\.$/,'')};
}
function secTitle(s,i){const l=label(s,i);return l.n?`${UI[lang].step} ${l.n}: ${l.t}`:l.t}

function build(){
  const A = ARTICLE[lang], U = UI[lang];
  document.documentElement.lang = lang;
  document.title = A.title;
  $('#brandTitle').textContent = A.title;
  $('#brandSmall').textContent = U.brand;
  $('#tocTitle').textContent = U.toc;
  $('#menuBtn').textContent = U.menu;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===lang));
  const vt = document.querySelectorAll('#viewToggle .chip'); vt[0].textContent=U.single; vt[1].textContent=U.all;

  // nav
  const items = A.sections.map((s,i)=>{const l=label(s,i);return `<li><button data-i="${i}"><span class="n">${l.n||'·'}</span><span>${l.t}</span></button></li>`}).join('')
    + `<li class="dl"><button data-i="${N}"><span class="n">↓</span><span>${U.dl}</span></button></li>`;
  $('#tocList').innerHTML = items;

  // panels
  let html = '';
  A.sections.forEach((s,i)=>{
    if (i===0){
      html += `<section class="panel hero" id="s0" data-i="0"><span class="kicker">${U.intro}</span><h1>${A.title}</h1><p class="sub">${A.sub}</p>${s.html}</section>`;
    } else {
      const l = label(s,i);
      html += `<section class="panel" id="s${i}" data-i="${i}">${l.n?`<span class="kicker">${U.step} ${l.n}</span>`:''}<h2>${l.t}</h2>${s.html}</section>`;
    }
  });
  html += downloadPanel();
  $('#main').innerHTML = html;
  document.querySelectorAll('#main figure img').forEach(im=>{im.classList.add('zoomable'); im.title=U.fig;});
  addPagers();
  bindFinder();
  $('#siteFoot').innerHTML = `${U.foot}: <a href="${REPO}" target="_blank" rel="noopener">github.com/gerardreverte/dades_sintetiques_renda</a>`;
  renderMath();
  show(idx,false);
}

function addPagers(){
  const A = ARTICLE[lang], U = UI[lang];
  document.querySelectorAll('.panel').forEach(p=>{
    const i = +p.dataset.i;
    const prev = i>0 ? `<button class="prev" data-i="${i-1}"><small>← ${U.prev}</small><span>${secTitle(A.sections[i-1],i-1)}</span></button>` : '<span></span>';
    let next = '';
    if (i<N-1) next = `<button class="next" data-i="${i+1}"><small>${U.next} →</small><span>${secTitle(A.sections[i+1],i+1)}</span></button>`;
    else if (i===N-1) next = `<button class="next" data-i="${N}"><small>${U.next} →</small><span>${U.dl}</span></button>`;
    if (i===N) {const pv=`<button class="prev" data-i="${N-1}"><small>← ${U.prev}</small><span>${secTitle(A.sections[N-1],N-1)}</span></button>`; p.insertAdjacentHTML('beforeend',`<div class="pager">${pv}</div>`); return;}
    p.insertAdjacentHTML('beforeend',`<div class="pager">${prev}${next}</div>`);
  });
}

function downloadPanel(){

function bindFinder(){
  const q = $('#q'), res = $('#res'), U = UI[lang];
  if (!q) return;
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const star = f => f ? '<span class="flag">*</span>' : '';
  function draw(){
    const t = norm(q.value.trim());
    const list = t ? MUNS.filter(m=>norm(m.n).includes(t)||m.c.startsWith(t)).slice(0,8) : MUNS.slice(0,5);
    if (!list.length){res.innerHTML=`<p style="padding:14px 16px;margin:0;font:400 .9rem var(--sans)">${U.none}</p>`;return}
    res.innerHTML = `<table><thead><tr><th>${U.code}</th><th>Dagum shape1</th><th>shape2</th><th>scale</th><th>${U.mean}</th><th>Pareto IV scale</th><th>shape</th><th>inequality</th><th>${U.mean}</th></tr></thead><tbody>`
      + list.map(m=>`<tr><td>${m.n} <span style="color:var(--muted);font-weight:400">${m.c}</span></td><td>${fmt(m.d[0])}${star(m.hd)}</td><td>${fmt(m.d[1])}</td><td>${fmt(m.d[2])}</td><td>${fmt(m.d[3])}</td><td>${fmt(m.p[0])}${star(m.hp)}</td><td>${fmt(m.p[1])}</td><td>${fmt(m.p[2])}</td><td>${fmt(m.p[3])}</td></tr>`).join('')
      + `</tbody></table><p style="margin:0;padding:8px 14px;font:400 .75rem var(--sans);color:var(--muted)">${U.hit}</p>`;
  }
  q.addEventListener('input',draw); draw();
}

function show(i,scroll=true){
  idx = Math.max(0,Math.min(N,i));
  document.querySelectorAll('.panel').forEach(p=>p.hidden = (mode==='single' && +p.dataset.i!==idx));

  closeMenu();

  if (scroll){
    if (mode==='all') document.getElementById('s'+idx).scrollIntoView({behavior:'smooth'});
    else window.scrollTo({top:0,behavior:'smooth'});
  }
  progress();
}
function progress(){
  const h = document.documentElement.scrollHeight - innerHeight;
  $('#bar').style.width = h>0 ? (100*scrollY/h)+'%' : '0';
  if (mode==='all'){
    let cur = 0;
    document.querySelectorAll('.panel').forEach(p=>{ if (p.getBoundingClientRect().top < 140) cur = +p.dataset.i; });
    document.querySelectorAll('#tocList button').forEach(b=>b.setAttribute('aria-current', +b.dataset.i===cur));
  }
}
function closeMenu(){ $('#toc').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false'); }

document.addEventListener('click',e=>{
  const nb = e.target.closest('[data-i]');
  if (nb && (nb.closest('#tocList')||nb.closest('.pager'))) { show(+nb.dataset.i); return; }
  const lb = e.target.closest('.seg button');
  if (lb){ lang = lb.dataset.lang; store.set('lang',lang); build(); return; }
  const ch = e.target.closest('#viewToggle .chip');
  if (ch){ mode = ch.dataset.mode; store.set('mode',mode); show(idx); return; }
  if (e.target.closest('#menuBtn')){ const o=$('#toc').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded',o); return; }
  if (e.target.closest('#themeBtn')){
    const r=document.documentElement, dark = r.dataset.theme==='dark' || (r.dataset.theme==='auto' && matchMedia('(prefers-color-scheme:dark)').matches);
    r.dataset.theme = dark?'light':'dark'; store.set('theme',r.dataset.theme); return;
  }
  const im = e.target.closest('img.zoomable');
  if (im){ const lbx=$('#lb'); lbx.querySelector('img').src=im.src; lbx.querySelector('img').alt=im.alt; lbx.classList.add('on'); return; }
  if (e.target.closest('#lb')) $('#lb').classList.remove('on');
});
document.addEventListener('keydown',e=>{
  if (e.key==='Escape'){ $('#lb').classList.remove('on'); closeMenu(); }
  if (/input|textarea/i.test(e.target.tagName)) return;
  if (mode==='single'){ if (e.key==='ArrowRight') show(idx+1); if (e.key==='ArrowLeft') show(idx-1); }
});
addEventListener('scroll',progress,{passive:true});
addEventListener('hashchange',()=>{ const m=location.hash.match(/^#s(\d+)$/); if(m && +m[1]!==idx) show(+m[1]); });

const th = store.get('theme'); if (th) document.documentElement.dataset.theme = th;
const m0 = location.hash.match(/^#s(\d+)$/); if (m0) idx = +m0[1];
build();
</script>
</body>
</html>
