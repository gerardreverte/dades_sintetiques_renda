<!doctype html>
<html lang="ca" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Del percentil a la persona · From Percentile to Person</title>
<meta name="description" content="Reconstruint la distribució de la renda amb dades sintètiques · Reconstructing the income distribution with synthetic data">
<meta property="og:title" content="Del percentil a la persona · From Percentile to Person">
<meta property="og:image" content="img/fig1.jpeg">
<style>
:root{
  --bg:#faf8f4; --surface:#fff; --ink:#1d2328; --muted:#5d6770; --line:#e4dfd6;
  --accent:#0e6b72; --accent-ink:#fff; --accent-soft:#e3f1f1; --warm:#c8782a; --warm-soft:#fbeedd;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 8px 24px rgba(20,30,40,.06);
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif; --display:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171b; --surface:#1a2127; --ink:#e8e6e1; --muted:#9aa5ad; --line:#2b343b;
  --accent:#58c1c8; --accent-ink:#0b1a1c; --accent-soft:#16312f; --warm:#e8a15a; --warm-soft:#33261a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --bg:#12171b; --surface:#1a2127; --ink:#e8e6e1; --muted:#9aa5ad; --line:#2b343b;
  --accent:#58c1c8; --accent-ink:#0b1a1c; --accent-soft:#16312f; --warm:#e8a15a; --warm-soft:#33261a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
img{max-width:100%;height:auto}
button{font:inherit;color:inherit}

/* barra superior */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;font-family:var(--sans)}
.brand{font-family:var(--display);font-weight:700;font-size:1.02rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.brand small{display:block;font:500 .7rem var(--sans);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--accent-soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font:600 .82rem var(--sans);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;font-size:1rem}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font:600 .82rem var(--sans);cursor:pointer}
.progress{height:3px;background:transparent}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--warm));transition:width .1s}

/* disseny general */
.shell{max-width:1180px;margin:0 auto;padding:28px 16px 80px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:48px;align-items:start}
nav.toc{position:sticky;top:84px;font-family:var(--sans);max-height:calc(100vh - 110px);overflow:auto;padding-right:6px}
nav.toc h2{font:600 .72rem var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
nav.toc ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
nav.toc li{margin:0}
nav.toc button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:8px 10px 8px 14px;margin-left:-2px;border-left:2px solid transparent;cursor:pointer;font-size:.9rem;line-height:1.35;color:var(--muted);border-radius:0 8px 8px 0}
nav.toc button:hover{color:var(--ink);background:var(--accent-soft)}
nav.toc button[aria-current="true"]{color:var(--ink);font-weight:600;border-left-color:var(--accent);background:var(--accent-soft)}
nav.toc .n{flex:none;min-width:1.5em;font:700 .8rem var(--sans);color:var(--accent);text-align:center}
nav.toc .n.dot{font-size:1.5rem;line-height:.8}
nav.toc li.step button{padding-left:34px}
nav.toc .dl button{color:var(--warm);font-weight:600}
.view-toggle{margin-top:18px;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:500 .78rem var(--sans);cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{min-width:0}
.panel[hidden]{display:none}
.panel{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body.all .panel{margin-bottom:64px;padding-bottom:40px;border-bottom:1px solid var(--line)}
.panel>h2{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,3.4vw,2.35rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 .7em}
.kicker{display:inline-block;font:700 .72rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;margin-bottom:12px}
.panel h3{font-family:var(--display);font-size:1.35rem;margin:2em 0 .5em;color:var(--accent);letter-spacing:-.01em}
.panel p{margin:0 0 1.15em}
.panel ul{padding-left:1.2em}.panel li{margin:.35em 0}
.panel li::marker{color:var(--accent)}
.grid-list{columns:2;column-gap:32px;padding:20px 24px 20px 40px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:.92em;line-height:1.5}
.grid-list li{break-inside:avoid}

.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:1.05;letter-spacing:-.03em;margin:.1em 0 .3em}
.hero .sub{font:500 1.1rem/1.5 var(--sans);color:var(--muted);margin:0 0 28px;max-width:46ch}

figure{margin:1.8em auto}
figure.fig img{display:block;width:100%;border-radius:14px;box-shadow:var(--shadow);background:#fff}
figure.fig-table img{padding:6px;border:1px solid var(--line);box-shadow:none}
figure.fig-row{max-width:none!important;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
figure.fig-row figcaption{grid-column:1/-1}
figcaption{font:400 .82rem/1.45 var(--sans);color:var(--muted);margin-top:8px;text-align:center}
.zoomable{cursor:zoom-in}

.eq{overflow-x:auto;padding:14px 18px;margin:1.2em 0;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;font-size:1.05em}
.eq .katex-display{margin:0}
blockquote.poem{margin:1.8em 0;padding:6px 0 6px 24px;border-left:3px solid var(--warm);font-style:italic;font-size:1.08em}
blockquote.poem p{margin:0 0 .8em}
blockquote.poem footer{font:400 .82rem var(--sans);color:var(--muted);font-style:normal}
aside.footnotes{margin-top:2.4em;padding-top:12px;border-top:1px solid var(--line);font:400 .85rem/1.5 var(--sans);color:var(--muted)}
aside.footnotes ol{margin:0;padding-left:1.3em}
sup.fnref a{text-decoration:none;font-weight:700}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;font-family:var(--sans)}
.pager button{flex:1;max-width:48%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.pager button:hover{border-color:var(--accent)}
.pager button.next{text-align:right;margin-left:auto}
.pager small{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pager span{font-weight:600;font-size:.95rem;line-height:1.3;display:block;margin-top:2px}
body.all .pager{display:none}

/* descàrregues */
.dl-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:24px 0 8px;font-family:var(--sans)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;color:var(--ink);font-size:1.25rem}
.card p{margin:0;font-size:.9rem;line-height:1.5;color:var(--muted)}
.card .meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{font:600 .72rem var(--sans);padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;margin-top:auto;padding:11px 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font:600 .92rem var(--sans)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.finder{margin-top:36px;font-family:var(--sans)}
.finder h3{font-family:var(--display)}
.finder input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 1rem var(--sans)}
.finder input:focus{outline:2px solid var(--accent);outline-offset:1px}
.tbl{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font:400 .78rem/1.4 var(--sans)}
th,td{padding:7px 5px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{white-space:normal;line-height:1.25}
th{font-weight:600;color:var(--muted);background:var(--accent-soft);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;font-weight:600}
th.gap,td.gap{padding:0;width:12px;min-width:12px;background:var(--surface);border-bottom:0}
thead th.gap{background:var(--surface)}
.tbl.scroll{max-height:440px;overflow:auto}
thead tr:first-child th{top:0;height:36px}
thead tr:nth-child(2) th{top:36px}
th.grp{text-align:center;font-size:.8rem;color:var(--ink);border-bottom:2px solid var(--accent);letter-spacing:.02em}
th.sep,td.sep{border-left:1px solid var(--line)}
td.code{text-align:left;color:var(--muted);font-weight:400}
tr:last-child td{border-bottom:0}
.flag{color:var(--warm);font-weight:700}
.note{margin-top:22px;padding:16px 18px;border-radius:12px;background:var(--warm-soft);font:400 .88rem/1.55 var(--sans)}
.note b{color:var(--warm)}
details.dict{margin-top:22px;font-family:var(--sans);font-size:.88rem}
details.dict summary{cursor:pointer;font-weight:600}
.license{margin-top:22px;font:400 .85rem/1.5 var(--sans);color:var(--muted)}

footer.site{border-top:1px solid var(--line);padding:30px 16px 50px;text-align:center;font:400 .85rem/1.6 var(--sans);color:var(--muted)}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:60;overflow:auto;overscroll-behavior:contain}
.lightbox.on{display:block}
.lightbox .lb-in{min-width:100%;min-height:100%;display:grid;place-items:center;padding:56px 20px 20px}
.lightbox img{display:block;max-width:100%;max-height:calc(100vh - 80px);background:#fff;border-radius:6px;cursor:zoom-in}
.lightbox.full .lb-in{display:block;width:max-content}
.lightbox.full img{max-width:none;max-height:none;width:var(--w);cursor:zoom-out}
.lb-bar{position:fixed;top:10px;right:14px;display:flex;gap:8px;z-index:61;font-family:var(--sans)}
.lb-bar button{border:0;border-radius:999px;background:rgba(255,255,255,.92);color:#111;padding:8px 14px;font:600 .82rem var(--sans);cursor:pointer}

@media (max-width:900px){
  body{font-size:18px}
  .shell{grid-template-columns:1fr;gap:0;padding-top:18px}
  .menu-btn{display:inline-block}
  nav.toc{position:fixed;inset:56px 0 0 0;z-index:25;background:var(--bg);padding:20px 16px;max-height:none;transform:translateX(-100%);transition:transform .25s}
  nav.toc.open{transform:none}
  .grid-list{columns:1}
  .dl-cards{grid-template-columns:1fr}
  figure.fig-row{grid-template-columns:1fr}
  .brand small{display:none}
}
@media (max-width:600px){.brand{visibility:hidden}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.top,nav.toc,.pager,.view-toggle{display:none}.shell{display:block}.panel[hidden]{display:block}}
</style>
</head>

      <button data-lang="ca" aria-pressed="true">Català</button>
      <button data-lang="en" aria-pressed="false">English</button>

</header>

</div>

const $ = s => document.querySelector(s);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang = store.get('lang') || ((navigator.language||'ca').toLowerCase().startsWith('en') ? 'en' : 'ca');
const params = new URLSearchParams(location.search); if (['ca','en'].includes(params.get('lang'))) lang = params.get('lang');
let idx = 0, mode = store.get('mode') || 'single';
const N = ARTICLE.ca.sections.length;      // la darrera "secció" (N) són les descàrregues
const fmt = (x,d=2) => x.toLocaleString(lang==='ca'?'es-ES':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

function label(s,i){
  if (i===0) return {n:'', t:UI[lang].intro};
  const m = s.title.match(/^(Pas|Step)\s+(\d)\s*[.:]\s*(.*?)\.?$/);
  if (m) return {n:m[2], t:m[3]};
  return {n:'', t:s.title.replace(/\.$/,'')};
}
function secTitle(s,i){const l=label(s,i);return l.n?`${UI[lang].step} ${l.n}: ${l.t}`:l.t}

function build(){
  const A = ARTICLE[lang], U = UI[lang];
  document.documentElement.lang = lang;
  document.title = A.title;
  $('#brandTitle').textContent = A.title;
  $('#brandSmall').textContent = U.brand;
  $('#tocTitle').textContent = U.toc;
  $('#menuBtn').textContent = U.menu;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===lang));
  const vt = document.querySelectorAll('#viewToggle .chip'); vt[0].textContent=U.single; vt[1].textContent=U.all;

  // nav
  const items = A.sections.map((s,i)=>{const l=label(s,i);return `<li${l.n?' class="step"':''}><button data-i="${i}"><span class="n${l.n?'':' dot'}">${l.n||'•'}</span><span>${l.t}</span></button></li>`}).join('')
    + `<li class="dl"><button data-i="${N}"><span class="n">↓</span><span>${U.dl}</span></button></li>`;

  A.sections.forEach((s,i)=>{
    if (i===0){
      html += `<section class="panel hero" id="s0" data-i="0"><span class="kicker">${U.intro}</span><h1>${A.title}</h1><p class="sub">${A.sub}</p>${s.html}</section>`;
    } else {
      const l = label(s,i);
      html += `<section class="panel" id="s${i}" data-i="${i}">${l.n?`<span class="kicker">${U.step} ${l.n}</span>`:''}<h2>${l.t}</h2>${s.html}</section>`;
    }
  });
  html += downloadPanel();
  $('#main').innerHTML = html;
  document.querySelectorAll('#main figure img').forEach(im=>{im.classList.add('zoomable'); im.title=U.fig;});
  addPagers();
  bindFinder();
  $('#siteFoot').innerHTML = `${U.foot}: <a href="${REPO}" target="_blank" rel="noopener">github.com/gerardreverte/dades_sintetiques_renda</a>`;
  renderMath();
  show(idx,false);
}

function addPagers(){
  const A = ARTICLE[lang], U = UI[lang];
  document.querySelectorAll('.panel').forEach(p=>{
    const i = +p.dataset.i;
    const prev = i>0 ? `<button class="prev" data-i="${i-1}"><small>← ${U.prev}</small><span>${secTitle(A.sections[i-1],i-1)}</span></button>` : '<span></span>';
    let next = '';
    if (i<N-1) next = `<button class="next" data-i="${i+1}"><small>${U.next} →</small><span>${secTitle(A.sections[i+1],i+1)}</span></button>`;
    else if (i===N-1) next = `<button class="next" data-i="${N}"><small>${U.next} →</small><span>${U.dl}</span></button>`;
    if (i===N) {const pv=`<button class="prev" data-i="${N-1}"><small>← ${U.prev}</small><span>${secTitle(A.sections[N-1],N-1)}</span></button>`; p.insertAdjacentHTML('beforeend',`<div class="pager">${pv}</div>`); return;}
    p.insertAdjacentHTML('beforeend',`<div class="pager">${prev}${next}</div>`);
  });
}

function downloadPanel(){
  const U = UI[lang];
  const hd = MUNS.filter(m=>m.hd).length, hp = MUNS.filter(m=>m.hp).length;
  const note = U.note.replace('__HD__',hd).replace('__HP__',hp);
  return `<section class="panel" id="s${N}" data-i="${N}">
    <span class="kicker">${U.dl}</span><h2>${U.dlTitle}</h2><p>${U.dlLead}</p>
    <div class="dl-cards">
      <div class="card"><h3>${U.dagum}</h3><div class="meta"><span class="tag">614 ${U.municipis}</span><span class="tag">CSV · 109 KB</span><span class="tag">2023</span></div><p>${U.dagumD}</p>
        <a class="btn" href="data/parametres_dagum_municipis.csv" download>⬇ ${U.download}</a></div>
      <div class="card"><h3>${U.pareto}</h3><div class="meta"><span class="tag">614 ${U.municipis}</span><span class="tag">CSV · 109 KB</span><span class="tag">2023</span></div><p>${U.paretoD}</p>
        <a class="btn" href="data/parametres_paretoIV_municipis.csv" download>⬇ ${U.download}</a></div>
    </div>
    <div class="finder"><h3>${U.find}</h3>
      <input id="q" type="search" placeholder="${U.findPh}" autocomplete="off" aria-label="${U.find}">
      <div class="tbl scroll" id="res"></div><p id="resnote" style="margin:8px 4px 0;font:400 .75rem var(--sans);color:var(--muted)"></p></div>
    <div class="note"><b>${U.noteH}.</b> ${note}</div>
    <details class="dict"><summary>${U.dictT}</summary>
      <div class="tbl"><table><tbody>${U.dict.map(r=>`<tr><td>${r[0]}</td><td style="text-align:left;white-space:normal">${r[1]}</td></tr>`).join('')}</tbody></table></div></details>
    <p class="license">${U.lic}</p></section>`;
}

function bindFinder(){
  const q = $('#q'), res = $('#res'), U = UI[lang];
  if (!q) return;
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const star = f => f ? '<span class="flag">*</span>' : '';
  function draw(){
    const t = norm(q.value.trim());
    const list = t ? MUNS.filter(m=>norm(m.n).includes(t)||m.c.startsWith(t)) : MUNS;
    if (!list.length){res.innerHTML=`<p style="padding:14px 16px;margin:0;font:400 .9rem var(--sans)">${U.none}</p>`;return}
    res.innerHTML = `<table><thead>
      <tr><th rowspan="2" style="vertical-align:bottom">${U.mun}</th><th rowspan="2" style="vertical-align:bottom;text-align:left">${U.code}</th><th class="grp" colspan="4">Dagum</th><th class="gap"></th><th class="grp" colspan="4">Pareto IV</th></tr>
      <tr><th>shape1</th><th>shape2</th><th>scale</th><th>${U.mean}</th><th class="gap"></th><th>scale</th><th>shape</th><th>inequality</th><th>${U.mean}</th></tr></thead><tbody>`
      + list.map(m=>`<tr><td>${m.n}</td><td class="code">${m.c}</td><td>${fmt(m.d[0])}${star(m.hd)}</td><td>${fmt(m.d[1])}</td><td>${fmt(m.d[2])}</td><td>${fmt(m.d[3])}</td><td class="gap"></td><td>${fmt(m.p[0])}${star(m.hp)}</td><td>${fmt(m.p[1])}</td><td>${fmt(m.p[2])}</td><td>${fmt(m.p[3])}</td></tr>`).join('')
      + `</tbody></table>`;
    $('#resnote').textContent = U.hit;
  }
  q.addEventListener('input',draw); draw();
}

function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
let katexReady = null;
function renderMath(){
  const K = 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/';
  katexReady = katexReady || loadScript(K+'katex.min.js').then(()=>loadScript(K+'contrib/auto-render.min.js'));
  katexReady.then(()=>renderMathInElement($('#main'),{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false})).catch(()=>{});
}

function show(i,scroll=true){
  idx = Math.max(0,Math.min(N,i));
  document.querySelectorAll('.panel').forEach(p=>p.hidden = (mode==='single' && +p.dataset.i!==idx));
  document.body.classList.toggle('all', mode==='all');
  document.querySelectorAll('#tocList button').forEach(b=>b.setAttribute('aria-current', +b.dataset.i===idx));
  document.querySelectorAll('#viewToggle .chip').forEach(c=>c.setAttribute('aria-pressed', c.dataset.mode===mode));
  closeMenu();
  if (history.replaceState) history.replaceState(null,'',(idx?'#s'+idx:location.pathname+location.search));
  if (scroll){
    if (mode==='all') document.getElementById('s'+idx).scrollIntoView({behavior:'smooth'});
    else window.scrollTo({top:0,behavior:'smooth'});
  }
  progress();
}
function progress(){
  const h = document.documentElement.scrollHeight - innerHeight;
  $('#bar').style.width = h>0 ? (100*scrollY/h)+'%' : '0';
  if (mode==='all'){
    let cur = 0;
    document.querySelectorAll('.panel').forEach(p=>{ if (p.getBoundingClientRect().top < 140) cur = +p.dataset.i; });
    document.querySelectorAll('#tocList button').forEach(b=>b.setAttribute('aria-current', +b.dataset.i===cur));
  }
}
function lbLabel(){ const f=$('#lb').classList.contains('full'); $('#lbZoom').textContent = (f ? '− ' : '+ ') + (f ? UI[lang].fit : UI[lang].full100); }
function openLb(im){
  const lb=$('#lb'), img=lb.querySelector('img');
  img.src=im.src; img.alt=im.alt;
  lb.style.setProperty('--w', (im.naturalWidth||2000)+'px');
  lb.classList.remove('full'); lb.classList.add('on'); lb.scrollTo(0,0); lbLabel();
  document.body.style.overflow='hidden';
}
function closeLb(){ $('#lb').classList.remove('on','full'); document.body.style.overflow=''; }
function toggleLb(){ const lb=$('#lb'); lb.classList.toggle('full'); lb.scrollTo(0,0); lbLabel(); }
function closeMenu(){ $('#toc').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false'); }

document.addEventListener('click',e=>{
  const nb = e.target.closest('[data-i]');
  if (nb && (nb.closest('#tocList')||nb.closest('.pager'))) { show(+nb.dataset.i); return; }
  const lb = e.target.closest('.seg button');
  if (lb){ lang = lb.dataset.lang; store.set('lang',lang); build(); return; }
  const ch = e.target.closest('#viewToggle .chip');
  if (ch){ mode = ch.dataset.mode; store.set('mode',mode); show(idx); return; }
  if (e.target.closest('#menuBtn')){ const o=$('#toc').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded',o); return; }
  if (e.target.closest('#themeBtn')){
    const r=document.documentElement, dark = r.dataset.theme==='dark' || (r.dataset.theme==='auto' && matchMedia('(prefers-color-scheme:dark)').matches);
    r.dataset.theme = dark?'light':'dark'; store.set('theme',r.dataset.theme); return;
  }
  const im = e.target.closest('img.zoomable');
  if (im){ openLb(im); return; }
  if (e.target.closest('#lbClose') || e.target.closest('.lb-in') && !e.target.closest('#lb img')) { closeLb(); return; }
  if (e.target.closest('#lb img') || e.target.closest('#lbZoom')) toggleLb();
});
document.addEventListener('keydown',e=>{
  if (e.key==='Escape'){ closeLb(); closeMenu(); }
  if (/input|textarea/i.test(e.target.tagName)) return;
  if (mode==='single'){ if (e.key==='ArrowRight') show(idx+1); if (e.key==='ArrowLeft') show(idx-1); }
});
addEventListener('scroll',progress,{passive:true});
addEventListener('hashchange',()=>{ const m=location.hash.match(/^#s(\d+)$/); if(m && +m[1]!==idx) show(+m[1]); });

const th = store.get('theme'); if (th) document.documentElement.dataset.theme = th;
const m0 = location.hash.match(/^#s(\d+)$/); if (m0) idx = +m0[1];
build();
</script>
</body>
</html>
